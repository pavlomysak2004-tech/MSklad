<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Підбір комплекту — #МитнийSklad</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0a0a0a; color: #fff; font-family: sans-serif; min-height: 100vh; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #0a0a0a; }
    ::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 2px; }
    input { background: #1a1a1a; border: 1px solid #2a2a2a; color: #fff; border-radius: 10px; padding: 10px; font-size: 16px; outline: none; width: 100%; text-align: center; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

const SUPABASE_URL = "https://svbmamaqrtsknuztxiuq.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN2Ym1hbWFxcnRza251enR4aXVxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkyMDkzMTcsImV4cCI6MjA5NDc4NTMxN30.4ieisyQMCsW2hon_vzNTTt00fRJe5eCXWklUBD9QC_o";
const BOT_TOKEN = "8852451114:AAGS6p47r0vn4rcbsC-okztcyiwQYrMahqo";
const OWNER_CHAT_ID = "1750776827";

function App() {
  const [pannos, setPannos] = useState([]);
  const [tiles, setTiles] = useState([]);
  const [loading, setLoading] = useState(true);
  const [page, setPage] = useState("picker");

  const [selectedPanno, setSelectedPanno] = useState(null);
  const [tileIndex, setTileIndex] = useState(0);
  const [pannoCounts, setPannoCounts] = useState({});

  const [length, setLength] = useState("5");
  const [width, setWidth] = useState("4");
  const [waste, setWaste] = useState(10);
  const [phone, setPhone] = useState("");
  const [sending, setSending] = useState(false);
  const [sent, setSent] = useState(false);
  const [orderNum, setOrderNum] = useState("");

  const touchStartX = useRef(null);

  useEffect(() => {
    const loadData = async () => {
      try {
        const headers = { "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY };
        const [pRes, tRes] = await Promise.all([
          fetch(SUPABASE_URL + "/rest/v1/collections?is_panno=eq.true&is_visible=eq.true&select=*,collection_photos(url,sort_order)&order=name", { headers }),
          fetch(SUPABASE_URL + "/rest/v1/collections?is_panno=eq.false&is_visible=eq.true&select=*,collection_photos(url,sort_order)&order=name", { headers })
        ]);
        const pData = await pRes.json();
        const tData = await tRes.json();

        const parse = (item) => {
          const photos = (item.collection_photos || []).sort((a,b) => a.sort_order - b.sort_order).map(p => p.url);
          return { ...item, image: photos[0] || "", images: photos };
        };

        const p = (pData || []).map(parse);
        const t = (tData || []).map(parse);
        setPannos(p);
        setTiles(t);
        if (p.length) setSelectedPanno(p[0]);
      } catch(e) { console.log(e); }
      setLoading(false);
    };
    loadData();
  }, []);

  const onTouchStart = (e) => { touchStartX.current = e.touches[0].clientX; };
  const onTouchEnd = (e) => {
    if (!touchStartX.current) return;
    const dx = e.changedTouches[0].clientX - touchStartX.current;
    if (Math.abs(dx) > 40) {
      if (dx < 0) setTileIndex(i => Math.min(i+1, tiles.length-1));
      else setTileIndex(i => Math.max(i-1, 0));
    }
    touchStartX.current = null;
  };

  const setPannoCount = (id, delta) => {
    setPannoCounts(prev => {
      const cur = prev[id] || 0;
      const next = Math.max(0, cur + delta);
      if (next === 0) { const copy = {...prev}; delete copy[id]; return copy; }
      return { ...prev, [id]: next };
    });
  };

  const currentTile = tiles[tileIndex];

  const totalPannoArea = Object.entries(pannoCounts).reduce((sum, [id, count]) => {
    const p = pannos.find(x => String(x.id) === String(id));
    const sizeMatch = (p?.size || "").match(/(\d+)/g);
    const area = sizeMatch && sizeMatch.length >= 2
      ? (parseFloat(sizeMatch[0]) * parseFloat(sizeMatch[1])) / 10000
      : 1.44;
    return sum + area * count;
  }, 0);

  const roomArea = parseFloat(length||0) * parseFloat(width||0);
  const tileNeeded = Math.max(0, (roomArea - totalPannoArea) * (1 + waste/100));
  const tileCount = currentTile?.tile_area > 0 ? Math.ceil(tileNeeded / currentTile.tile_area) : 0;
  const exactTileArea = currentTile?.tile_area > 0 ? tileCount * currentTile.tile_area : tileNeeded;

  const pannoTotal = Object.entries(pannoCounts).reduce((sum, [id, count]) => {
    const p = pannos.find(x => String(x.id) === String(id));
    return sum + (p?.price_uah || 0) * count;
  }, 0);
  const tileTotal = Math.round(exactTileArea * (currentTile?.price_uah || 0));
  const grandTotal = Math.round(pannoTotal + tileTotal);

  const getNextOrderNum = async () => {
    try {
      const res = await fetch(SUPABASE_URL + "/rest/v1/settings?key=eq.order_counter&select=value", {
        headers: { "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY }
      });
      const data = await res.json();
      const next = parseInt(data[0]?.value || "0") + 1;
      await fetch(SUPABASE_URL + "/rest/v1/settings?key=eq.order_counter", {
        method: "PATCH",
        headers: { "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY, "Content-Type": "application/json" },
        body: JSON.stringify({ value: next.toString() })
      });
      return "#МС-" + String(next).padStart(4, "0");
    } catch { return "#МС-" + Date.now().toString().slice(-4); }
  };

  const handleOrder = async () => {
    if (!phone.trim()) return;
    setSending(true);
    const num = await getNextOrderNum();
    setOrderNum(num);

    const pannoLines = Object.entries(pannoCounts).map(([id, count]) => {
      const p = pannos.find(x => String(x.id) === String(id));
      return "🎨 " + (p?.name || id) + " × " + count + " = " + ((p?.price_uah||0)*count).toLocaleString() + " грн";
    }).join("\n");

    const text = "🛒 НОВЕ ЗАМОВЛЕННЯ " + num + "\n\n" +
      "📐 Кімната: " + length + "×" + width + " = " + roomArea.toFixed(1) + " м²\n" +
      (pannoLines ? pannoLines + "\n" : "") +
      "🔲 Плитка: " + (currentTile?.name||"") + "\n" +
      "   " + exactTileArea.toFixed(2) + " м²" + (tileCount ? " (" + tileCount + " шт)" : "") + " = " + tileTotal.toLocaleString() + " грн\n" +
      "💰 Разом: " + grandTotal.toLocaleString() + " грн\n" +
      "📞 " + phone;

    try {
      await fetch("https://api.telegram.org/bot" + BOT_TOKEN + "/sendMessage", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ chat_id: OWNER_CHAT_ID, text })
      });
    } catch(e) { console.log(e); }
    setSending(false);
    setSent(true);
  };

  const btnStyle = (active) => ({
    flex: 1, padding: "8px 0", borderRadius: 8,
    border: "1px solid " + (active ? "#c9a84c" : "#2a2a2a"),
    background: active ? "#c9a84c11" : "transparent",
    color: active ? "#c9a84c" : "#555",
    cursor: "pointer", fontSize: 12, fontWeight: 700,
  });

  if (loading) return (
    <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center" }}>
      <div style={{ color: "#c9a84c", fontSize: 14 }}>⟳ Завантаження...</div>
    </div>
  );

  /* ── ORDER PAGE ── */
  if (page === "order") return (
    <div style={{ maxWidth: 480, margin: "0 auto", paddingBottom: 40 }}>
      <div style={{ padding: "16px 20px", borderBottom: "1px solid #1a1a1a", display: "flex", alignItems: "center", gap: 12, position: "sticky", top: 0, background: "#0a0a0aee", backdropFilter: "blur(20px)", zIndex: 10 }}>
        <button onClick={() => setPage("picker")} style={{ background: "#1a1a1a", border: "none", color: "#777", cursor: "pointer", width: 34, height: 34, borderRadius: "50%", fontSize: 18 }}>←</button>
        <div>
          <div style={{ color: "#c9a84c", fontSize: 10, letterSpacing: 2, textTransform: "uppercase" }}>Оформлення</div>
          <div style={{ color: "#fff", fontSize: 16, fontWeight: 700, fontFamily: "serif" }}>Параметри замовлення</div>
        </div>
      </div>

      <div style={{ padding: 20 }}>
        {!sent ? <>
          {/* Кімната */}
          <div style={{ background: "#111", borderRadius: 14, padding: 16, marginBottom: 14, border: "1px solid #1e1e1e" }}>
            <div style={{ color: "#c9a84c", fontSize: 10, letterSpacing: 2, textTransform: "uppercase", marginBottom: 12 }}>📐 Кімната</div>
            <div style={{ display: "flex", gap: 12, marginBottom: 8 }}>
              <div style={{ flex: 1 }}>
                <div style={{ color: "#555", fontSize: 11, marginBottom: 4 }}>Довжина (м)</div>
                <input type="number" value={length} onChange={e => setLength(e.target.value)} />
              </div>
              <div style={{ display: "flex", alignItems: "center", paddingTop: 20, color: "#333", fontSize: 18 }}>×</div>
              <div style={{ flex: 1 }}>
                <div style={{ color: "#555", fontSize: 11, marginBottom: 4 }}>Ширина (м)</div>
                <input type="number" value={width} onChange={e => setWidth(e.target.value)} />
              </div>
            </div>
            <div style={{ display: "flex", justifyContent: "space-between", padding: "8px 0", borderTop: "1px solid #1a1a1a" }}>
              <span style={{ color: "#555", fontSize: 12 }}>Площа кімнати</span>
              <span style={{ color: "#fff", fontWeight: 700 }}>{roomArea.toFixed(1)} м²</span>
            </div>
          </div>

          {/* Запас */}
          <div style={{ background: "#111", borderRadius: 14, padding: 16, marginBottom: 14, border: "1px solid #1e1e1e" }}>
            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 10 }}>
              <div style={{ color: "#c9a84c", fontSize: 10, letterSpacing: 2, textTransform: "uppercase" }}>Запас на обрізку</div>
              <span style={{ color: "#c9a84c", fontWeight: 700 }}>{waste}%</span>
            </div>
            <div style={{ display: "flex", gap: 8 }}>
              {[5,10,15,20].map(w => (
                <button key={w} onClick={() => setWaste(w)} style={btnStyle(waste===w)}>{w}%</button>
              ))}
            </div>
          </div>

          {/* Панно */}
          {Object.keys(pannoCounts).length > 0 && (
            <div style={{ background: "#111", borderRadius: 14, padding: 16, marginBottom: 14, border: "1px solid #1e1e1e" }}>
              <div style={{ color: "#c9a84c", fontSize: 10, letterSpacing: 2, textTransform: "uppercase", marginBottom: 12 }}>🎨 Панно</div>
              {Object.entries(pannoCounts).map(([id, count]) => {
                const p = pannos.find(x => String(x.id) === String(id));
                const sizeMatch = (p?.size || "").match(/(\d+)/g);
                const area = sizeMatch && sizeMatch.length >= 2 ? (parseFloat(sizeMatch[0]) * parseFloat(sizeMatch[1])) / 10000 : 1.44;
                return (
                  <div key={id} style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 10 }}>
                    {p?.image && <img src={p.image} style={{ width: 44, height: 44, borderRadius: 8, objectFit: "cover" }} />}
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ color: "#fff", fontSize: 12, fontWeight: 700, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{p?.name || id}</div>
                      <div style={{ color: "#555", fontSize: 11 }}>× {count} = {(area * count).toFixed(2)} м²</div>
                    </div>
                    <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                      <button onClick={() => setPannoCount(id, -1)} style={{ width: 28, height: 28, borderRadius: "50%", background: "#1a1a1a", border: "1px solid #2a2a2a", color: "#fff", cursor: "pointer", fontSize: 16 }}>−</button>
                      <span style={{ color: "#fff", fontSize: 14, fontWeight: 700, minWidth: 20, textAlign: "center" }}>{count}</span>
                      <button onClick={() => setPannoCount(id, 1)} style={{ width: 28, height: 28, borderRadius: "50%", background: "#c9a84c", border: "none", color: "#000", cursor: "pointer", fontSize: 16 }}>+</button>
                    </div>
                  </div>
                );
              })}
              <div style={{ borderTop: "1px solid #1a1a1a", paddingTop: 8, display: "flex", justifyContent: "space-between" }}>
                <span style={{ color: "#555", fontSize: 12 }}>Займають площу</span>
                <span style={{ color: "#fff", fontWeight: 700 }}>{totalPannoArea.toFixed(2)} м²</span>
              </div>
            </div>
          )}

          {/* Плитка */}
          {currentTile && (
            <div style={{ background: "#111", borderRadius: 14, padding: 16, marginBottom: 14, border: "1px solid #1e1e1e" }}>
              <div style={{ color: "#c9a84c", fontSize: 10, letterSpacing: 2, textTransform: "uppercase", marginBottom: 12 }}>🔲 Плитка</div>
              <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 10 }}>
                {currentTile.image && <img src={currentTile.image} style={{ width: 44, height: 44, borderRadius: 8, objectFit: "cover" }} />}
                <div>
                  <div style={{ color: "#fff", fontSize: 13, fontWeight: 700 }}>{currentTile.name}</div>
                  <div style={{ color: "#555", fontSize: 11 }}>{currentTile.size}</div>
                </div>
              </div>
              <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 4 }}>
                <span style={{ color: "#555", fontSize: 12 }}>Потрібно (мінус панно + запас)</span>
                <span style={{ color: "#c9a84c", fontWeight: 700 }}>{exactTileArea.toFixed(2)} м²</span>
              </div>
              {tileCount > 0 && <div style={{ color: "#444", fontSize: 11 }}>{tileCount} шт</div>}
            </div>
          )}

          {/* Підсумок */}
          <div style={{ background: "#1a1a1a", borderRadius: 14, padding: 16, marginBottom: 16, border: "1px solid #c9a84c22" }}>
            <div style={{ color: "#c9a84c", fontSize: 10, letterSpacing: 2, textTransform: "uppercase", marginBottom: 12 }}>💰 Підсумок</div>
            {pannoTotal > 0 && (
              <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}>
                <span style={{ color: "#555", fontSize: 13 }}>Панно</span>
                <span style={{ color: "#fff", fontSize: 13 }}>{pannoTotal.toLocaleString()} грн</span>
              </div>
            )}
            {tileTotal > 0 && (
              <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}>
                <span style={{ color: "#555", fontSize: 13 }}>Плитка</span>
                <span style={{ color: "#fff", fontSize: 13 }}>{tileTotal.toLocaleString()} грн</span>
              </div>
            )}
            <div style={{ borderTop: "1px solid #2a2a2a", paddingTop: 10, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <span style={{ color: "#fff", fontSize: 15, fontWeight: 700 }}>Разом</span>
              <span style={{ color: "#fff", fontSize: 24, fontWeight: 900 }}>{grandTotal.toLocaleString()} <span style={{ color: "#c9a84c", fontSize: 14 }}>грн</span></span>
            </div>
          </div>

          {/* Телефон */}
          <input type="tel" value={phone}
            onChange={e => setPhone(e.target.value.replace(/[^0-9+]/g, ""))}
            placeholder="+380XXXXXXXXX" maxLength={13}
            style={{ marginBottom: 12, border: phone ? "1px solid #c9a84c44" : "1px solid #2a2a2a" }} />

          <button onClick={handleOrder} disabled={!phone.trim() || sending} style={{
            width: "100%", padding: 14, borderRadius: 12, border: "none",
            background: phone.trim() ? "linear-gradient(135deg, #c9a84c, #b8860b)" : "#1a1a1a",
            color: phone.trim() ? "#000" : "#555",
            fontSize: 15, fontWeight: 800, cursor: phone.trim() ? "pointer" : "not-allowed",
          }}>{sending ? "⏳ Відправляю..." : "🛒 Замовити комплект"}</button>

        </> : (
          <div style={{ textAlign: "center", padding: "40px 0" }}>
            <div style={{ fontSize: 48, marginBottom: 16 }}>✅</div>
            <div style={{ color: "#c9a84c", fontSize: 14, fontWeight: 700, marginBottom: 8 }}>{orderNum}</div>
            <div style={{ color: "#fff", fontSize: 18, fontFamily: "serif", fontWeight: 700, marginBottom: 8 }}>Замовлення прийнято!</div>
            <div style={{ color: "#555", fontSize: 13 }}>Менеджер зателефонує на<br/><span style={{ color: "#fff", fontWeight: 700 }}>{phone}</span></div>
            <button onClick={() => { setPage("picker"); setSent(false); setPhone(""); }} style={{ marginTop: 24, padding: "10px 24px", borderRadius: 10, background: "#1a1a1a", border: "1px solid #2a2a2a", color: "#777", cursor: "pointer" }}>← Назад до підбору</button>
          </div>
        )}
      </div>
    </div>
  );

  /* ── PICKER PAGE ── */
  return (
    <div style={{ maxWidth: 480, margin: "0 auto" }}>
      {/* Header */}
      <div style={{ padding: "16px 20px", borderBottom: "1px solid #1a1a1a", position: "sticky", top: 0, background: "#0a0a0aee", backdropFilter: "blur(20px)", zIndex: 10 }}>
        <div style={{ color: "#c9a84c", fontSize: 10, letterSpacing: 2, textTransform: "uppercase" }}>Підбір комплекту</div>
        <div style={{ color: "#fff", fontSize: 18, fontWeight: 900, fontFamily: "serif" }}>#МитнийSklad</div>
      </div>

      {/* Панно вибір мініатюри */}
      <div style={{ padding: "14px 20px 0" }}>
        <div style={{ color: "#555", fontSize: 11, letterSpacing: 1, textTransform: "uppercase", marginBottom: 8 }}>🎨 Оберіть панно</div>
        <div style={{ display: "flex", gap: 8, overflowX: "auto", paddingBottom: 8, scrollbarWidth: "none" }}>
          {pannos.map(p => (
            <div key={p.id} onClick={() => setSelectedPanno(p)} style={{
              flexShrink: 0, width: 72, cursor: "pointer",
              border: selectedPanno?.id === p.id ? "2px solid #c9a84c" : "2px solid transparent",
              borderRadius: 10, overflow: "hidden", transition: "all 0.2s",
              opacity: selectedPanno?.id === p.id ? 1 : 0.6,
            }}>
              <img src={p.image} style={{ width: "100%", height: 54, objectFit: "cover", display: "block" }} />
            </div>
          ))}
        </div>
      </div>

      {/* Велике фото панно */}
      {selectedPanno && (
        <div style={{ position: "relative", marginTop: 10 }}>
          <img src={selectedPanno.image} alt={selectedPanno.name}
            style={{ width: "100%", height: 260, objectFit: "cover", display: "block" }} />
          <div style={{ position: "absolute", bottom: 0, left: 0, right: 0, padding: "30px 16px 14px", background: "linear-gradient(to top, rgba(0,0,0,0.9), transparent)" }}>
            <div style={{ color: "#c9a84c", fontSize: 10, letterSpacing: 1 }}>ПАННО</div>
            <div style={{ color: "#fff", fontSize: 15, fontWeight: 700 }}>{selectedPanno.name}</div>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 4 }}>
              <span style={{ color: "#aaa", fontSize: 12 }}>{selectedPanno.size}</span>
              <span style={{ color: "#c9a84c", fontSize: 14, fontWeight: 700 }}>{(selectedPanno.price_uah||0).toLocaleString()} грн</span>
            </div>
          </div>
          {/* Лічильник панно */}
          <div style={{ position: "absolute", top: 12, right: 12, display: "flex", alignItems: "center", gap: 8, background: "rgba(0,0,0,0.75)", borderRadius: 20, padding: "6px 12px", backdropFilter: "blur(8px)" }}>
            <button onClick={() => setPannoCount(selectedPanno.id, -1)} style={{ width: 26, height: 26, borderRadius: "50%", background: "#1a1a1a", border: "1px solid #333", color: "#fff", cursor: "pointer", fontSize: 16, display: "flex", alignItems: "center", justifyContent: "center" }}>−</button>
            <span style={{ color: "#fff", fontSize: 15, fontWeight: 700, minWidth: 24, textAlign: "center" }}>{pannoCounts[selectedPanno.id] || 0}</span>
            <button onClick={() => setPannoCount(selectedPanno.id, 1)} style={{ width: 26, height: 26, borderRadius: "50%", background: "#c9a84c", border: "none", color: "#000", cursor: "pointer", fontSize: 16, display: "flex", alignItems: "center", justifyContent: "center" }}>+</button>
          </div>
        </div>
      )}

      {/* Роздільник */}
      <div style={{ display: "flex", alignItems: "center", gap: 12, padding: "10px 20px" }}>
        <div style={{ flex: 1, height: 1, background: "#1a1a1a" }} />
        <span style={{ color: "#333", fontSize: 11 }}>+ плитка</span>
        <div style={{ flex: 1, height: 1, background: "#1a1a1a" }} />
      </div>

      {/* Велике фото плитки зі свайпом */}
      <div onTouchStart={onTouchStart} onTouchEnd={onTouchEnd} style={{ position: "relative" }}>
        {currentTile && (
          <>
            <img src={currentTile.image || ""} alt={currentTile.name}
              style={{ width: "100%", height: 260, objectFit: "cover", display: "block" }} />
            <div style={{ position: "absolute", bottom: 0, left: 0, right: 0, padding: "30px 16px 14px", background: "linear-gradient(to top, rgba(0,0,0,0.9), transparent)" }}>
              <div style={{ color: "#7b68ee", fontSize: 10, letterSpacing: 1 }}>ПЛИТКА ← свайп →</div>
              <div style={{ color: "#fff", fontSize: 15, fontWeight: 700 }}>{currentTile.name}</div>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 4 }}>
                <span style={{ color: "#aaa", fontSize: 12 }}>{currentTile.size}</span>
                <span style={{ color: "#c9a84c", fontSize: 14, fontWeight: 700 }}>{(currentTile.price_uah||0).toLocaleString()} грн/м²</span>
              </div>
            </div>
            <button onClick={() => setTileIndex(i => Math.max(i-1, 0))} style={{ position: "absolute", left: 12, top: "50%", transform: "translateY(-50%)", width: 36, height: 36, borderRadius: "50%", background: "rgba(0,0,0,0.6)", border: "1px solid rgba(255,255,255,0.2)", color: "#fff", fontSize: 20, cursor: "pointer", opacity: tileIndex === 0 ? 0.3 : 1 }}>‹</button>
            <button onClick={() => setTileIndex(i => Math.min(i+1, tiles.length-1))} style={{ position: "absolute", right: 12, top: "50%", transform: "translateY(-50%)", width: 36, height: 36, borderRadius: "50%", background: "rgba(0,0,0,0.6)", border: "1px solid rgba(255,255,255,0.2)", color: "#fff", fontSize: 20, cursor: "pointer", opacity: tileIndex === tiles.length-1 ? 0.3 : 1 }}>›</button>
            <div style={{ position: "absolute", top: 12, left: "50%", transform: "translateX(-50%)", background: "rgba(0,0,0,0.6)", borderRadius: 20, padding: "4px 10px", color: "#fff", fontSize: 11 }}>{tileIndex+1}/{tiles.length}</div>
          </>
        )}
      </div>

      {/* Підсумок + кнопка */}
      <div style={{ padding: "16px 20px 40px" }}>
        {(pannoTotal > 0 || tileTotal > 0) && (
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12, padding: "10px 14px", background: "#111", borderRadius: 10, border: "1px solid #1e1e1e" }}>
            <span style={{ color: "#555", fontSize: 13 }}>Орієнтовна сума</span>
            <span style={{ color: "#c9a84c", fontSize: 16, fontWeight: 800 }}>{grandTotal.toLocaleString()} грн</span>
          </div>
        )}
        <button onClick={() => setPage("order")} style={{
          width: "100%", padding: 14, borderRadius: 12, border: "none",
          background: "linear-gradient(135deg, #c9a84c, #b8860b)",
          color: "#000", fontSize: 15, fontWeight: 800, cursor: "pointer",
        }}>🛒 Замовити комплект →</button>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
