const TELEGRAM_USERNAME = "your_manager";
const WHATSAPP_NUMBER = "380991234567";

  "",
  "",
  "",
];

const BOT_TOKEN = "8852451114:AAGS6p47r0vn4rcbsC-okztcyiwQYrMahqo";
const OWNER_CHAT_ID = "1750776827";

function LiveChat() {
  const [open, setOpen] = useState(false);
  const [messages, setMessages] = useState([
    { id: 1, from: "bot", text: "Привіт! 👋 Я менеджер #МитнийSklad. Задайте будь-яке питання про плитку!", time: new Date().toLocaleTimeString("uk", {hour:"2-digit",minute:"2-digit"}) }
  ]);
  const [input, setInput] = useState("");
  const [sending, setSending] = useState(false);
  const [clientId] = useState(() => "c" + Math.random().toString(36).substr(2,6));
  const messagesEndRef = useRef(null);
  const lastUpdateRef = useRef(0);

  useEffect(() => {
    messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
  }, [messages]);

  useEffect(() => {
    if (!open) return;
    const poll = async () => {
      try {
        const res = await fetch("https://api.telegram.org/bot" + BOT_TOKEN + "/getUpdates?offset=" + (lastUpdateRef.current + 1) + "&timeout=3");
        const data = await res.json();
        if (data.ok && data.result.length > 0) {
          data.result.forEach(update => {
            lastUpdateRef.current = update.update_id;
            const msg = update.message;
            if (msg && msg.from && String(msg.from.id) === OWNER_CHAT_ID && msg.text) {
              setMessages(prev => [...prev, {
                id: Date.now() + Math.random(),
                from: "bot",
                text: msg.text,
                time: new Date().toLocaleTimeString("uk", {hour:"2-digit",minute:"2-digit"})
              }]);
            }
          });
        }
      } catch(e) {}
    };
    const interval = setInterval(poll, 3000);
    return () => clearInterval(interval);
  }, [open]);

  const sendMessage = async () => {
    if (!input.trim() || sending) return;
    const text = input.trim();
    setInput("");
    setSending(true);
    setMessages(prev => [...prev, {
      id: Date.now(),
      from: "user",
      text,
      time: new Date().toLocaleTimeString("uk", {hour:"2-digit",minute:"2-digit"})
    }]);
    try {
      await fetch("https://api.telegram.org/bot" + BOT_TOKEN + "/sendMessage", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          chat_id: OWNER_CHAT_ID,
          text: "💬 Клієнт [" + clientId + "] пише:\n" + text
        })
      });
    } catch(e) {}
    setSending(false);
  };

  return (
    <>
      <button onClick={() => setOpen(o => !o)} style={{
        position: "fixed", bottom: 90, right: 20, zIndex: 600,
        width: 52, height: 52, borderRadius: "50%",
        background: "linear-gradient(135deg, #229ED9, #1a7fb5)",
        border: "none", cursor: "pointer",
        boxShadow: "0 4px 20px rgba(34,158,217,0.5)",
        display: "flex", alignItems: "center", justifyContent: "center",
        fontSize: 24,
      }}>💬</button>

      {open && (
        <>
          <div onClick={() => setOpen(false)} style={{
            position: "fixed", inset: 0, zIndex: 700,
            background: "rgba(0,0,0,0.4)",
          }} />
          <div style={{
            position: "fixed", bottom: 0, right: 0, zIndex: 800,
            width: "min(380px, 100vw)",
            height: "min(520px, 80vh)",
            background: "#0f0f0f",
            borderRadius: "20px 20px 0 0",
            border: "1px solid #2a2a2a",
            display: "flex", flexDirection: "column",
            animation: "slideUp 0.3s ease",
            boxShadow: "0 -10px 40px rgba(0,0,0,0.6)",
          }}>
            {/* Шапка */}
            <div style={{ padding: "16px 18px", borderBottom: "1px solid #1a1a1a", display: "flex", alignItems: "center", gap: 12, flexShrink: 0 }}>
              <div style={{ width: 38, height: 38, borderRadius: "50%", background: "linear-gradient(135deg, #c9a84c, #b8860b)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 18 }}>🏪</div>
              <div style={{ flex: 1 }}>
                <div style={{ color: "#fff", fontSize: 14, fontWeight: 700 }}>Менеджер #МитнийSklad</div>
                <div style={{ display: "flex", alignItems: "center", gap: 5 }}>
                  <div style={{ width: 6, height: 6, borderRadius: "50%", background: "#4caf50" }} />
                  <span style={{ color: "#4caf50", fontSize: 11 }}>Онлайн</span>
                </div>
              </div>
              <button onClick={() => setOpen(false)} style={{ background: "#1a1a1a", border: "none", color: "#555", cursor: "pointer", width: 32, height: 32, borderRadius: "50%", fontSize: 18, display: "flex", alignItems: "center", justifyContent: "center" }}>×</button>
            </div>

            {/* Повідомлення */}
            <div style={{ flex: 1, overflowY: "auto", padding: "14px 16px", display: "flex", flexDirection: "column", gap: 10 }}>
              {messages.map(msg => (
                <div key={msg.id} style={{ display: "flex", justifyContent: msg.from === "user" ? "flex-end" : "flex-start" }}>
                  <div style={{
                    maxWidth: "78%", padding: "9px 13px",
                    borderRadius: msg.from === "user" ? "16px 16px 4px 16px" : "16px 16px 16px 4px",
                    background: msg.from === "user" ? "linear-gradient(135deg, #c9a84c, #b8860b)" : "#1a1a1a",
                    color: msg.from === "user" ? "#000" : "#ddd",
                    fontSize: 13, lineHeight: 1.5,
                  }}>
                    <div>{msg.text}</div>
                    <div style={{ fontSize: 10, opacity: 0.6, marginTop: 3, textAlign: "right" }}>{msg.time}</div>
                  </div>
                </div>
              ))}
              <div ref={messagesEndRef} />
            </div>

            {/* Введення */}
            <div style={{ padding: "12px 16px", borderTop: "1px solid #1a1a1a", display: "flex", gap: 8, flexShrink: 0 }}>
              <input
                value={input}
                onChange={e => setInput(e.target.value)}
                onKeyDown={e => e.key === "Enter" && sendMessage()}
                placeholder="Напишіть питання..."
                style={{ flex: 1, padding: "10px 14px", borderRadius: 20, background: "#1a1a1a", border: "1px solid #2a2a2a", color: "#fff", fontSize: 13, outline: "none" }}
              />
              <button onClick={sendMessage} disabled={sending} style={{
                width: 42, height: 42, borderRadius: "50%",
                background: "linear-gradient(135deg, #c9a84c, #b8860b)",
                border: "none", cursor: "pointer", fontSize: 18,
                display: "flex", alignItems: "center", justifyContent: "center",
                opacity: sending ? 0.5 : 1,
              }}>➤</button>
            </div>
          </div>
        </>
      )}
    </>
  );
}

            .sort((a, b) => a.sort_order - b.sort_order)
            .map(p => p.url);

          const existing = staticCollections.find(c => c.id === i + 1) || staticCollections[0];

          return {
            ...existing,
            id: item.id,
            name: item.name || existing.name,
            subtitle: item.article || existing.subtitle,
            size: item.size || existing.size,
            price: item.price_uah || existing.price,
            stock: item.stock || 0,
            reserve: item.reserve || 0,
            totalStock: (item.stock || 0) + (item.reserve || 0),
            unit: item.unit || "м²",
            tileArea: item.tile_area || 0,
            description: item.description || existing.description,
            tags: item.tags || existing.tags || [],
            finish: item.finish || existing.finish || "",
            image: photos[0] || existing.image,
            images: photos.length > 0 ? photos : existing.images || [existing.image],
            isPanno: false,
          };
        });

        setCollections(parsed);
      } catch(e) {
        console.log("Supabase error, using static data:", e);
      } finally {
        setLoading(false);
      }
    };

    fetchFromSupabase();
    // Оновлення кожні 5 хвилин
    const interval = setInterval(fetchFromSupabase, 5 * 60 * 1000);
    return () => clearInterval(interval);
  }, []);

  return { collections, loading };
}

// Fullscreen свайп-галерея
function TileViewer({ tile, onClose }) {
  const [current, setCurrent] = useState(0);
  const images = tile.images || [tile.image];
  const total = images.length;

  const touchStartX = useRef(null);
  const touchStartY = useRef(null);

  const prev = (e) => { e && e.stopPropagation(); setCurrent(i => (i - 1 + total) % total); };
  const next = (e) => { e && e.stopPropagation(); setCurrent(i => (i + 1) % total); };

  const onTouchStart = (e) => {
    touchStartX.current = e.touches[0].clientX;
    touchStartY.current = e.touches[0].clientY;
  };
  const onTouchEnd = (e) => {
    if (touchStartX.current === null) return;
    const dx = e.changedTouches[0].clientX - touchStartX.current;
    const dy = Math.abs(e.changedTouches[0].clientY - touchStartY.current);
    if (Math.abs(dx) > 40 && Math.abs(dx) > dy) {
      dx < 0 ? next() : prev();
    }
    touchStartX.current = null;
  };

  return (
    <div
      style={{
        position: "fixed", inset: 0, zIndex: 2000,
        background: "#000",
        display: "flex", flexDirection: "column",
        alignItems: "center", justifyContent: "center",
        userSelect: "none",
      }}
      onTouchStart={onTouchStart}
      onTouchEnd={onTouchEnd}
      onClick={onClose}
    >
      {/* Фото */}
      <img
        key={current}
        src={images[current]}
        alt={tile.name}
        onClick={e => e.stopPropagation()}
        style={{
          width: "100%", height: "100%",
          objectFit: "contain",
          display: "block",
          animation: "fadeSlide 0.28s ease",
        }}
      />

      {/* Стрілки (для десктопу) */}
      {total > 1 && (
        <>
          <button onClick={prev} style={{
            position: "absolute", left: 12, top: "50%", transform: "translateY(-50%)",
            width: 44, height: 44, borderRadius: "50%",
            background: "rgba(0,0,0,0.55)", backdropFilter: "blur(8px)",
            border: "1px solid rgba(255,255,255,0.18)",
            color: "#fff", fontSize: 22, cursor: "pointer",
            display: "flex", alignItems: "center", justifyContent: "center",
          }}>‹</button>
          <button onClick={next} style={{
            position: "absolute", right: 12, top: "50%", transform: "translateY(-50%)",
            width: 44, height: 44, borderRadius: "50%",
            background: "rgba(0,0,0,0.55)", backdropFilter: "blur(8px)",
            border: "1px solid rgba(255,255,255,0.18)",
            color: "#fff", fontSize: 22, cursor: "pointer",
            display: "flex", alignItems: "center", justifyContent: "center",
          }}>›</button>
        </>
      )}

      {/* Закрити */}
      <button onClick={onClose} style={{
        position: "absolute", top: 16, right: 16,
        width: 40, height: 40, borderRadius: "50%",
        background: "rgba(0,0,0,0.6)", backdropFilter: "blur(10px)",
        border: "1px solid rgba(255,255,255,0.2)",
        color: "#fff", fontSize: 20, cursor: "pointer",
        display: "flex", alignItems: "center", justifyContent: "center",
      }}>×</button>

      {/* Крапки-індикатори */}
      {total > 1 && (
        <div style={{
          position: "absolute", bottom: 100, left: 0, right: 0,
          display: "flex", justifyContent: "center", gap: 8,
        }} onClick={e => e.stopPropagation()}>
          {images.map((_, i) => (
            <div key={i} onClick={() => setCurrent(i)} style={{
              width: i === current ? 22 : 8,
              height: 8, borderRadius: 4,
              background: i === current ? "#c9a84c" : "rgba(255,255,255,0.4)",
              transition: "all 0.3s ease",
              cursor: "pointer",
            }} />
          ))}
        </div>
      )}

      {/* Назва внизу */}
      <div style={{
        position: "absolute", bottom: 0, left: 0, right: 0,
        padding: "40px 24px 32px",
        background: "linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 100%)",
        pointerEvents: "none",
      }}>
        <div style={{ color: "#c9a84c", fontSize: 11, letterSpacing: 2, textTransform: "uppercase", marginBottom: 4 }}>{tile.subtitle}</div>
        <div style={{ color: "#fff", fontSize: 22, fontFamily: "serif", fontWeight: 700 }}>{tile.name}</div>
        <div style={{ color: "#aaa", fontSize: 13, marginTop: 4 }}>{tile.size} · {tile.finish} · {current + 1}/{total}</div>
      </div>
    </div>
  );
}

function RoomCalculator({ tile, onClose }) {
  const tileArea = tile.tileArea || 0;
  const hasTileData = tileArea > 0;
  const step = hasTileData ? tileArea : 0.01;

  const [length, setLength] = useState("5");
  const [width, setWidth] = useState("4");
  const [waste, setWaste] = useState(10);

  const roomArea = parseFloat(length || 0) * parseFloat(width || 0);
  const withWaste = roomArea > 0 ? roomArea * (1 + waste / 100) : 0;
  const initTiles = hasTileData ? Math.ceil(withWaste / tileArea) : 0;
  const [tileCount, setTileCount] = useState(initTiles);
  const inputRef = useRef(null);

  useEffect(() => {
    if (withWaste > 0) {
      const t = hasTileData ? Math.ceil(withWaste / tileArea) : 0;
      setTileCount(t);
      if (inputRef.current) inputRef.current.value = (hasTileData ? t * tileArea : withWaste).toFixed(2);
    }
  }, [withWaste, waste]);

  const area = hasTileData ? tileCount * tileArea : withWaste;
  const totalPrice = area * tile.price;
  const enoughStock = area <= tile.stock;

  const decrease = () => {
    const newCount = Math.max(1, tileCount - 1);
    setTileCount(newCount);
    if (inputRef.current) inputRef.current.value = (newCount * tileArea).toFixed(2);
  };
  const increase = () => {
    const newCount = tileCount + 1;
    setTileCount(newCount);
    if (inputRef.current) inputRef.current.value = (newCount * tileArea).toFixed(2);
  };

  return (
    <div style={{
      position: "fixed", inset: 0, background: "rgba(0,0,0,0.88)", zIndex: 1100,
      display: "flex", alignItems: "center", justifyContent: "center", padding: 16,
    }} onClick={onClose}>
      <div style={{
        background: "#0f0f0f", borderRadius: 20, maxWidth: 420, width: "100%",
        border: "1px solid #2a2a2a", overflow: "hidden", animation: "fadeIn 0.25s ease",
      }} onClick={e => e.stopPropagation()}>

        {/* Header */}
        <div style={{ padding: "20px 22px 16px", borderBottom: "1px solid #1a1a1a", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <div>
            <div style={{ color: "#c9a84c", fontSize: 10, letterSpacing: 2, textTransform: "uppercase", marginBottom: 4 }}>📏 Калькулятор кімнати</div>
            <div style={{ color: "#fff", fontSize: 17, fontFamily: "serif", fontWeight: 700 }}>{tile.name}</div>
            {hasTileData && <div style={{ color: "#444", fontSize: 11, marginTop: 2 }}>1 плитка = {tileArea.toFixed(4)} м²</div>}
          </div>
          <button onClick={onClose} style={{ background: "#1a1a1a", border: "none", color: "#555", cursor: "pointer", width: 34, height: 34, borderRadius: "50%", fontSize: 18, display: "flex", alignItems: "center", justifyContent: "center" }}>×</button>
        </div>

        <div style={{ padding: "20px 22px 24px" }}>
          {/* Розміри кімнати */}
          <div style={{ display: "flex", gap: 12, marginBottom: 16 }}>
            <div style={{ flex: 1 }}>
              <div style={{ color: "#555", fontSize: 11, marginBottom: 6, textAlign: "center" }}>Довжина (м)</div>
              <input type="number" value={length}
                onChange={e => setLength(e.target.value)}
                style={{ width: "100%", padding: "12px", borderRadius: 10, background: "#1a1a1a", border: "1px solid #2a2a2a", color: "#fff", fontSize: 18, fontWeight: 700, textAlign: "center", outline: "none" }} />
            </div>
            <div style={{ display: "flex", alignItems: "center", paddingTop: 22, color: "#333", fontSize: 20 }}>×</div>
            <div style={{ flex: 1 }}>
              <div style={{ color: "#555", fontSize: 11, marginBottom: 6, textAlign: "center" }}>Ширина (м)</div>
              <input type="number" value={width}
                onChange={e => setWidth(e.target.value)}
                style={{ width: "100%", padding: "12px", borderRadius: 10, background: "#1a1a1a", border: "1px solid #2a2a2a", color: "#fff", fontSize: 18, fontWeight: 700, textAlign: "center", outline: "none" }} />
            </div>
          </div>

          {/* Запас */}
          <div style={{ marginBottom: 16 }}>
            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}>
              <span style={{ color: "#555", fontSize: 12 }}>Запас на обрізку</span>
              <span style={{ color: "#c9a84c", fontWeight: 700, fontSize: 13 }}>{waste}%</span>
            </div>
            <div style={{ display: "flex", gap: 8 }}>
              {[5, 10, 15, 20].map(w => (
                <button key={w} onClick={() => setWaste(w)} style={{
                  flex: 1, padding: "7px 0", borderRadius: 8, border: "1px solid",
                  borderColor: waste === w ? "#c9a84c" : "#2a2a2a",
                  background: waste === w ? "#c9a84c11" : "transparent",
                  color: waste === w ? "#c9a84c" : "#555",
                  cursor: "pointer", fontSize: 12, fontWeight: 700,
                }}>{w}%</button>
              ))}
            </div>
          </div>

          {/* Кількість плиток +/- */}
          {tileCount > 0 && (
            <>
              <div style={{ marginBottom: 16 }}>
                <div style={{ color: "#555", fontSize: 12, textAlign: "center", marginBottom: 12 }}>Кількість</div>
                <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 12 }}>
                  <button onClick={decrease} style={{
                    width: 44, height: 44, borderRadius: "50%",
                    background: "#1a1a1a", border: "1px solid #2a2a2a",
                    color: "#fff", fontSize: 24, cursor: "pointer",
                    display: "flex", alignItems: "center", justifyContent: "center",
                  }}>−</button>
                  <div style={{ textAlign: "center" }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                      <input
                        ref={inputRef}
                        type="number"
                        defaultValue={area.toFixed(2)}
                        onBlur={e => {
                          const val = parseFloat(e.target.value);
                          if (!isNaN(val) && val > 0) {
                            const t = hasTileData ? Math.round(val / tileArea) : 0;
                            setTileCount(t);
                            e.target.value = (hasTileData ? t * tileArea : val).toFixed(2);
                          }
                        }}
                        onKeyDown={e => { if (e.key === "Enter") e.target.blur(); }}
                        style={{
                          width: 130, padding: "8px 10px", borderRadius: 10,
                          background: "#1a1a1a", border: "1px solid #2a2a2a",
                          color: "#fff", fontSize: 22, fontWeight: 900,
                          textAlign: "center", outline: "none",
                        }}
                      />
                      <span style={{ color: "#c9a84c", fontSize: 16, fontWeight: 700 }}>м²</span>
                    </div>
                    {hasTileData && <div style={{ color: "#555", fontSize: 11, marginTop: 6 }}>{tileCount} шт</div>}
                  </div>
                  <button onClick={increase} style={{
                    width: 44, height: 44, borderRadius: "50%",
                    background: "linear-gradient(135deg, #c9a84c, #b8860b)",
                    border: "none", color: "#000", fontSize: 24, cursor: "pointer",
                    display: "flex", alignItems: "center", justifyContent: "center",
                  }}>+</button>
                </div>
              </div>

              {/* Результат */}
              <div style={{ background: "#1a1a1a", borderRadius: 12, padding: "14px 16px", border: "1px solid #c9a84c22", marginBottom: 16 }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                  <div>
                    <div style={{ color: "#555", fontSize: 12 }}>Загальна сума</div>
                    <div style={{ color: "#444", fontSize: 10, marginTop: 2 }}>{tile.price.toLocaleString()} грн/м² × {area.toFixed(2)} м²</div>
                  </div>
                  <div style={{ textAlign: "right" }}>
                    <div style={{ color: "#fff", fontSize: 24, fontWeight: 900 }}>{totalPrice.toLocaleString()} <span style={{ color: "#c9a84c", fontSize: 14 }}>грн</span></div>
                  </div>
                </div>
                <div style={{
                  marginTop: 10, padding: "7px 10px", borderRadius: 8,
                  background: enoughStock ? "#4caf5011" : "#f4433611",
                  border: `1px solid ${enoughStock ? "#4caf5033" : "#f4433633"}`,
                  textAlign: "center", fontSize: 12,
                  color: enoughStock ? "#4caf50" : "#f44336",
                }}>
                  {enoughStock ? `✓ На складі достатньо (${tile.stock} м²)` : `⚠ На складі лише ${tile.stock} м²`}
                </div>
              </div>
            </>
          )}
        </div>
      </div>
    </div>
  );
}

function StockBar({ stock, reserve, totalStock, unit }) {
  const total = totalStock || (stock + reserve);
  if (!total) return null;
  const freePercent = Math.round((stock / total) * 100);
  const reservePercent = Math.round((reserve / total) * 100);
  const hasReserve = reserve > 0;
  return (
    <div style={{ padding: "10px 0 4px" }}>
      <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11, marginBottom: 5 }}>
        <span style={{ color: "#555" }}>Склад</span>
        <span style={{ color: "#fff", fontWeight: 700 }}>{total.toLocaleString()} {unit}</span>
      </div>
      <div style={{ height: 6, background: "#1a1a1a", borderRadius: 3, overflow: "hidden", marginBottom: 6, display: "flex" }}>
        <div style={{ height: "100%", width: freePercent + "%", background: "#4caf50", borderRadius: 3, flexShrink: 0 }} />
        {hasReserve && <div style={{ height: "100%", width: reservePercent + "%", background: "#ff9800", flexShrink: 0 }} />}
      </div>
      <div style={{ display: "flex", gap: 12, fontSize: 10 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
          <span style={{ width: 8, height: 8, borderRadius: 2, background: "#4caf50", display: "inline-block" }} />
          <span style={{ color: "#555" }}>Вільно: <span style={{ color: "#fff", fontWeight: 700 }}>{stock.toLocaleString()} {unit}</span></span>
        </div>
        {hasReserve && (
          <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
            <span style={{ width: 8, height: 8, borderRadius: 2, background: "#ff9800", display: "inline-block" }} />
            <span style={{ color: "#555" }}>Резерв: <span style={{ color: "#fff", fontWeight: 700 }}>{reserve.toLocaleString()} {unit}</span></span>
          </div>
        )}
      </div>
    </div>
  );
}

          <button onClick={(e) => { e.stopPropagation(); onVisualize(tile); }} style={{ flex: 1, padding: "11px 0", borderRadius: 10, background: "linear-gradient(135deg, #c9a84c, #b8860b)", border: "none", color: "#000", cursor: "pointer", fontSize: 12, fontWeight: 800 }}>✦ Інтер'єр</button>
          <button onClick={(e) => { e.stopPropagation(); onCalc(tile); }} style={{ padding: "11px 12px", borderRadius: 10, background: "transparent", border: "1px solid #2a2a2a", color: "#777", cursor: "pointer", fontSize: 13 }}>📏</button>
          <button onClick={handleShare} style={{ padding: "11px 12px", borderRadius: 10, background: "transparent", border: "1px solid #2a2a2a", color: "#777", cursor: "pointer", fontSize: 13 }}>🔗</button>
          <button onClick={(e) => { e.stopPropagation(); onOrder(tile); }} style={{ flex: 1, padding: "11px 0", borderRadius: 10, background: "transparent", border: "1px solid #c9a84c44", color: "#c9a84c", cursor: "pointer", fontSize: 12, fontWeight: 700 }}>🛒 Замовити</button>
        </div>
      </div>
    </div>
  );
}

function TileCatalog() {
  const { collections, loading } = useCollections();
  const [activeFilter, setActiveFilter] = useState("Всі");
  const [visualizing, setVisualizing] = useState(null);
  const [ordering, setOrdering] = useState(null);
  const [viewing3D, setViewing3D] = useState(null);
  const [search, setSearch] = useState("");
  const [activeCard, setActiveCard] = useState(0);
  const [navOpen, setNavOpen] = useState(false);
  const [calcTile, setCalcTile] = useState(null);
  const [pannoModal, setPannoModal] = useState(null);
  const [priceRange, setPriceRange] = useState([800, 2000]);
  const cardRefs = useRef({});

  const scrollToCard = (id) => {
    const el = cardRefs.current[id];
    if (el) {
      el.scrollIntoView({ behavior: "smooth", block: "center" });
      setActiveCard(id);
    }
  };
  // Динамічні фільтри з усіх тегів колекцій
  const allTags = ["Всі", "Панно", ...Array.from(new Set(
    [...collections, ...pannos].flatMap(c => c.tags || [])
  )).sort()];
  const filters = allTags;
  const allItems = [...collections, ...pannos];
  const allPrices = allItems.map(t => t.price);
  const minPrice = Math.min(...allPrices);
  const maxPrice = Math.max(...allPrices);

  const filtered = allItems.filter(t => {
    const matchFilter = activeFilter === "Всі" || t.tags.includes(activeFilter);
    const matchSearch = t.name.toLowerCase().includes(search.toLowerCase()) || t.subtitle.toLowerCase().includes(search.toLowerCase());
    const matchPrice = t.price >= priceRange[0] && t.price <= priceRange[1];
    return matchFilter && matchSearch && matchPrice;
  });

  return (
    <div style={{ minHeight: "100vh", background: "#0a0a0a", fontFamily: "sans-serif", color: "#fff" }}>
      <style>{`
        @keyframes fadeIn { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:none; } }
        @keyframes pulse { 0%,100% { opacity:0.6; } 50% { opacity:1; } }
        @keyframes fadeSlide { from { opacity:0; transform:translateX(30px); } to { opacity:1; transform:none; } }
        @keyframes slideIn { from { transform:translateX(100%); } to { transform:translateX(0); } }
        @keyframes slideUp { from { transform:translateY(100%); opacity:0; } to { transform:translateY(0); opacity:1; } }
        * { box-sizing: border-box; }
      `}</style>

      {/* Header */}
      <div style={{ borderBottom: "1px solid #141414", padding: "20px 24px", display: "flex", alignItems: "center", justifyContent: "space-between", position: "sticky", top: 0, background: "#0a0a0aee", backdropFilter: "blur(20px)", zIndex: 100 }}>
        <div>
          <div style={{ color: "#c9a84c", fontSize: 10, letterSpacing: 3, textTransform: "uppercase", marginBottom: 2 }}>Ексклюзивні колекції від компанії</div>
          <div style={{ color: "#fff", fontSize: 22, fontFamily: "serif", fontWeight: 900 }}><span style={{ color: "#fff" }}>#МитнийSklad</span></div>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <div style={{ width: 8, height: 8, borderRadius: "50%", background: "#4caf50" }} />
          <span style={{ color: "#555", fontSize: 11 }}>{collections.length} колекції</span>
        </div>
      </div>

      {/* Stats */}
      <div style={{ padding: "32px 24px 24px", background: "linear-gradient(180deg, #0f0e0a 0%, #0a0a0a 100%)" }}>
        <div style={{ display: "flex", gap: 24, marginBottom: 24, flexWrap: "wrap" }}>
          {[
            [loading ? "..." : collections.length + pannos.length, "Колекцій"],
            [loading ? "..." : collections.reduce((s,t) => s + (t.stock||0), 0).toLocaleString("uk") + " м²", "На складі"]
          ].map(([v, l], i) => (
            <div key={i} style={{ flex: 1, minWidth: 120, background: "#111", borderRadius: 12, padding: 16, border: "1px solid #1a1a1a" }}>
              <div style={{ color: i===0 ? "#c9a84c" : "#fff", fontSize: 22, fontWeight: 800 }}>{v}</div>
              <div style={{ color: "#555", fontSize: 11, marginTop: 2 }}>{l}</div>
            </div>
          ))}
        </div>
        <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Пошук колекції..." style={{ width: "100%", padding: "12px 16px", borderRadius: 12, background: "#111", border: "1px solid #1e1e1e", color: "#fff", fontSize: 13, outline: "none", marginBottom: 16 }} />
        <div style={{ display: "flex", gap: 8, overflowX: "auto", paddingBottom: 4 }}>
          {filters.map(f => (
            <button key={f} onClick={() => setActiveFilter(f)} style={{ whiteSpace: "nowrap", padding: "7px 16px", borderRadius: 20, border: "1px solid", borderColor: activeFilter===f?"#c9a84c":"#1e1e1e", background: activeFilter===f?"#c9a84c":"transparent", color: activeFilter===f?"#000":"#555", cursor: "pointer", fontSize: 12, fontWeight: 700 }}>{f}</button>
          ))}
        </div>

        {/* Фільтр за ціною */}
        <div style={{ marginTop: 16, background: "#111", borderRadius: 14, padding: "14px 16px", border: "1px solid #1a1a1a" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
            <span style={{ color: "#777", fontSize: 12 }}>💰 Ціна за м²</span>
            <span style={{ color: "#c9a84c", fontSize: 13, fontWeight: 700 }}>
              {priceRange[0].toLocaleString()} — {priceRange[1].toLocaleString()} грн
            </span>
          </div>
          {/* Від */}
          <div style={{ marginBottom: 8 }}>
            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 4 }}>
              <span style={{ color: "#444", fontSize: 10 }}>Від</span>
              <span style={{ color: "#666", fontSize: 10 }}>{priceRange[0].toLocaleString()} грн</span>
            </div>
            <input type="range"
              min={800} max={2000} step={50}
              value={priceRange[0]}
              onChange={e => {
                const val = Number(e.target.value);
                if (val < priceRange[1]) setPriceRange([val, priceRange[1]]);
              }}
              style={{ width: "100%", accentColor: "#c9a84c", cursor: "pointer" }}
            />
          </div>
          {/* До */}
          <div>
            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 4 }}>
              <span style={{ color: "#444", fontSize: 10 }}>До</span>
              <span style={{ color: "#666", fontSize: 10 }}>{priceRange[1].toLocaleString()} грн</span>
            </div>
            <input type="range"
              min={800} max={2000} step={50}
              value={priceRange[1]}
              onChange={e => {
                const val = Number(e.target.value);
                if (val > priceRange[0]) setPriceRange([priceRange[0], val]);
              }}
              style={{ width: "100%", accentColor: "#c9a84c", cursor: "pointer" }}
            />
          </div>
          {/* Скинути */}
          {(priceRange[0] !== 800 || priceRange[1] !== 2000) && (
            <button onClick={() => setPriceRange([800, 2000])} style={{
              marginTop: 10, padding: "5px 12px", borderRadius: 8,
              background: "transparent", border: "1px solid #2a2a2a",
              color: "#555", cursor: "pointer", fontSize: 11,
            }}>✕ Скинути фільтр</button>
          )}
        </div>
      </div>

      {/* Grid */}
      <div style={{ padding: "8px 24px 40px", display: "grid", gap: 20, gridTemplateColumns: "repeat(auto-fill, minmax(300px, 1fr))" }}>
        {loading && (
          <div style={{ gridColumn: "1/-1", textAlign: "center", padding: 40 }}>
            <div style={{ color: "#c9a84c", fontSize: 13, animation: "pulse 1.5s infinite" }}>⟳ Завантаження даних зі складу...</div>
          </div>
        )}
        {filtered.map((tile, i) => (
          <div key={tile.id} ref={el => cardRefs.current[tile.id] = el} style={{ animation: `fadeIn 0.4s ease both`, animationDelay: `${i * 0.08}s` }}>
            <TileCard tile={tile} onVisualize={setVisualizing} onOrder={setOrdering} onView3D={tile.isPanno ? null : setViewing3D} onCalc={setCalcTile} onPanno={tile.isPanno ? setPannoModal : null} />
          </div>
        ))}
      </div>

      <div style={{ borderTop: "1px solid #141414", padding: "20px 24px", textAlign: "center" }}>
        <div style={{ color: "#333", fontSize: 11 }}>Тільки для гуртових клієнтів · Мінімальне замовлення від 30 м²</div>
        <div style={{ color: "#c9a84c", fontSize: 11, marginTop: 4 }}>📞 Зв'язатися з менеджером</div>
      </div>

      {/* Плаваюча кнопка навігації */}
      <button
        onClick={() => setNavOpen(true)}
        style={{
          position: "fixed", bottom: 28, right: 20, zIndex: 600,
          width: 52, height: 52, borderRadius: "50%",
          background: "linear-gradient(135deg, #c9a84c, #b8860b)",
          border: "none", cursor: "pointer",
          boxShadow: "0 4px 20px rgba(201,168,76,0.5)",
          display: "flex", alignItems: "center", justifyContent: "center",
          fontSize: 22,
        }}
      >☰</button>

      {/* Drawer навігація */}
      {navOpen && (
        <>
          {/* Затемнення фону */}
          <div onClick={() => setNavOpen(false)} style={{
            position: "fixed", inset: 0, zIndex: 700,
            background: "rgba(0,0,0,0.6)", backdropFilter: "blur(4px)",
          }} />

          {/* Панель */}
          <div style={{
            position: "fixed", top: 0, right: 0, bottom: 0, zIndex: 800,
            width: "min(320px, 85vw)",
            background: "#0f0f0f",
            borderLeft: "1px solid #2a2a2a",
            display: "flex", flexDirection: "column",
            animation: "slideIn 0.28s cubic-bezier(0.23,1,0.32,1)",
          }}>
            {/* Шапка панелі */}
            <div style={{
              padding: "20px 18px 14px",
              borderBottom: "1px solid #1a1a1a",
              display: "flex", justifyContent: "space-between", alignItems: "center",
              flexShrink: 0,
            }}>
              <div>
                <div style={{ color: "#c9a84c", fontSize: 10, letterSpacing: 2, textTransform: "uppercase" }}>Швидка навігація</div>
                <div style={{ color: "#fff", fontSize: 16, fontWeight: 700, marginTop: 2 }}>{collections.length} колекції</div>
              </div>
              <button onClick={() => setNavOpen(false)} style={{
                background: "#1a1a1a", border: "none", color: "#666",
                cursor: "pointer", width: 34, height: 34, borderRadius: "50%",
                fontSize: 18, display: "flex", alignItems: "center", justifyContent: "center",
              }}>×</button>
            </div>

            {/* Список колекцій */}
            <div style={{ overflowY: "auto", flex: 1, padding: "8px 0" }}>
              {collections.map((tile, i) => (
                <div
                  key={tile.id}
                  onClick={() => {
                    setNavOpen(false);
                    setTimeout(() => {
                      const el = cardRefs.current[tile.id];
                      if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
                      setActiveCard(tile.id);
                    }, 200);
                  }}
                  style={{
                    display: "flex", alignItems: "center", gap: 12,
                    padding: "10px 18px", cursor: "pointer",
                    background: activeCard === tile.id ? "#c9a84c11" : "transparent",
                    borderLeft: `3px solid ${activeCard === tile.id ? "#c9a84c" : "transparent"}`,
                    transition: "all 0.15s",
                  }}
                >
                  {/* Мініатюра */}
                  <div style={{ width: 48, height: 56, borderRadius: 8, overflow: "hidden", flexShrink: 0, border: activeCard === tile.id ? "1px solid #c9a84c" : "1px solid #2a2a2a" }}>
                    <img src={tile.image} alt={tile.name} style={{ width: "100%", height: "100%", objectFit: "cover" }} />
                  </div>
                  {/* Інфо */}
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ color: activeCard === tile.id ? "#c9a84c" : "#fff", fontSize: 13, fontWeight: 700, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{tile.name}</div>
                    <div style={{ color: "#555", fontSize: 11, marginTop: 2 }}>{tile.size}</div>
                    <div style={{ color: "#c9a84c", fontSize: 12, fontWeight: 700, marginTop: 2 }}>{tile.price.toLocaleString()} грн/м²</div>
                  </div>
                  {/* Номер */}
                  <div style={{ color: "#333", fontSize: 12, fontWeight: 700, flexShrink: 0 }}>#{i + 1}</div>
                </div>
              ))}
            </div>
          </div>
        </>
      )}

      {viewing3D && <TileViewer tile={viewing3D} onClose={() => setViewing3D(null)} />}
      {calcTile && <RoomCalculator tile={calcTile} onClose={() => setCalcTile(null)} />}
      {pannoModal && <PannoModal panno={pannoModal} collections={collections} onClose={() => setPannoModal(null)} />}
      <LiveChat />
      {visualizing && <AIVisualization tile={visualizing} onClose={() => setVisualizing(null)} />}
      {ordering && <OrderModal tile={ordering} onClose={() => setOrdering(null)} />}
    </div>
  );
}



    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<TileCatalog />);
  </script>
</body>
</html>
