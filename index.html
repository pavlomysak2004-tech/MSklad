// Рахує площу однієї плитки (м²) з поля розміру типу "120*60", "120x60", "120х60"
function parseTileArea(size) {
  if (!size) return 0;
  const m = String(size).match(/(\d+(?:[.,]\d+)?)\s*[*xXхХ×]\s*(\d+(?:[.,]\d+)?)/);
  if (!m) return 0;
  const a = parseFloat(m[1].replace(",", "."));
  const b = parseFloat(m[2].replace(",", "."));
  if (!a || !b) return 0;
  // Розміри в см → переводимо в м² (ділимо на 10000)
  return parseFloat(((a * b) / 10000).toFixed(4));
}

const CACHE_KEY = "msklad_catalog_v1";
const CACHE_TTL = 5 * 60 * 1000; // 5 хвилин

function useCollections() {
  // Завантажуємо кеш миттєво
  const cached = (() => {
    try {
      const c = JSON.parse(localStorage.getItem(CACHE_KEY) || "null");

    } catch(e) {}
    return null;

  const [pannos, setPannos] = useState(cached?.pannos || []);
  const [loading, setLoading] = useState(!cached);

    };

    const fetchFromSupabase = async () => {
      try {
        const [res, resP] = await Promise.all([
          fetch("https://svbmamaqrtsknuztxiuq.supabase.co/rest/v1/collections?is_panno=eq.false&is_visible=eq.true&select=*,collection_photos(url,sort_order)&order=sort_order,created_at", { headers: HEADERS }),
          fetch("https://svbmamaqrtsknuztxiuq.supabase.co/rest/v1/collections?is_panno=eq.true&is_visible=eq.true&select=*,collection_photos(url,sort_order)&order=sort_order,created_at", { headers: HEADERS })
        ]);
        const data = await res.json();
        if (!data || !Array.isArray(data)) return;

        const parsed = data.map((item, i) => {
          const photos = (item.collection_photos || [])
            .sort((a, b) => a.sort_order - b.sort_order)
            .map(p => p.url);

          const existing = staticCollections.find(c => c.id === i + 1) || staticCollections[0];

          return {
            ...existing,
            id: item.id,
            article: item.article || "",
            name: item.name || existing.name,
            subtitle: item.article || existing.subtitle,
            size: item.size || existing.size,
            price: item.price_uah || existing.price,
            stock: item.stock || 0,
            reserve: item.reserve || 0,
            totalStock: (item.stock || 0) + (item.reserve || 0),
            unit: item.unit || "м²",
            tileArea: item.tile_area || parseTileArea(item.size) || 0,
            description: item.description || existing.description,
            tags: item.tags || existing.tags || [],
            finish: item.finish || existing.finish || "",
            finishTags: item.finish_tags || [],
            salePrice: item.sale_price || 0,
            salePercent: item.sale_percent || 0,
            saleUntil: item.sale_until || null,
            expectedDate: item.expected_date || null,
            expectedQty: item.expected_qty || null,
            reviews: item.reviews || [],
            bundleArticles: item.bundle_articles || [],
            image: photos[0] || existing.image,
            images: photos.length > 0 ? photos : existing.images || [existing.image],
            isPanno: false,
          };
        });

        setCollections(parsed);

        const pannosData = await resP.json();
        if (Array.isArray(pannosData)) {
          const parsedPannos = pannosData.map((item, i) => {
            const photos = (item.collection_photos || [])
              .sort((a, b) => a.sort_order - b.sort_order)
              .map(p => p.url);
            return {
              id: item.id,
              article: item.article || "",
              name: item.name || "",
              subtitle: item.article || "Декоративне панно",
              size: item.size || "",
              price: item.price_uah || 0,
              stock: item.stock || 0,
              reserve: item.reserve || 0,
              totalStock: (item.stock || 0) + (item.reserve || 0),
              unit: item.unit || "шт",
              description: item.description || "",
              tags: item.tags || ["Панно"],
              image: photos[0] || "",
              images: photos.length > 0 ? photos : [""],
              expectedDate: item.expected_date || null,
              expectedQty: item.expected_qty || null,
              isPanno: true,
            };

    fetchFromSupabase();
    const interval = setInterval(fetchFromSupabase, 5 * 60 * 1000);
    return () => clearInterval(interval);
  }, []);

  return { collections, pannos, loading };
}

// Fullscreen свайп-галерея
function TileViewer({ tile, onClose, hideInfo }) {
  const [current, setCurrent] = useState(0);
  const images = tile.images || [tile.image];
  const total = images.length;
  const [zoom, setZoom] = useState(false);
  const [zoomPos, setZoomPos] = useState({ x: 50, y: 50 });
  const imgRef = useRef(null);

  const touchStartX = useRef(null);
  const touchStartY = useRef(null);

  const prev = (e) => { e && e.stopPropagation(); setCurrent(i => (i - 1 + total) % total); setZoom(false); };
  const next = (e) => { e && e.stopPropagation(); setCurrent(i => (i + 1) % total); setZoom(false); };

  const onTouchStart = (e) => {
    touchStartX.current = e.touches[0].clientX;
    touchStartY.current = e.touches[0].clientY;
  };
  const onTouchEnd = (e) => {
    if (touchStartX.current === null) return;
    const dx = e.changedTouches[0].clientX - touchStartX.current;
    const dy = Math.abs(e.changedTouches[0].clientY - touchStartY.current);
    if (Math.abs(dx) > 40 && Math.abs(dx) > dy) {
      dx < 0 ? next() : prev();
    }
    touchStartX.current = null;
  };

  const handleMouseMove = (e) => {
    if (!zoom) return;
    const rect = imgRef.current?.getBoundingClientRect();
    if (!rect) return;
    const x = ((e.clientX - rect.left) / rect.width) * 100;
    const y = ((e.clientY - rect.top) / rect.height) * 100;
    setZoomPos({ x, y });
  };

  const handleClick = (e) => {
    e.stopPropagation();
    setZoom(z => !z);
  };

  return (
    <div
      style={{
        position: "fixed", inset: 0, zIndex: 2000,
        background: "#000",
        display: "flex", flexDirection: "column",
        alignItems: "center", justifyContent: "center",
        userSelect: "none",
      }}
      onTouchStart={onTouchStart}
      onTouchEnd={onTouchEnd}
      onClick={onClose}
    >
      {/* Фото з zoom */}
      <div
        ref={imgRef}
        onClick={handleClick}
        onMouseMove={handleMouseMove}
        onMouseLeave={() => setZoom(false)}
        style={{
          width: "100%", height: "100%",

        />

          <div style={{
            position: "absolute", bottom: 70, left: "50%", transform: "translateX(-50%)",

            color: "#fff", fontSize: 11, fontWeight: 600,
            pointerEvents: "none",
          }}>🔍 Клікни для збільшення</div>
        )}
      </div>

      {/* Стрілки (для десктопу) */}
      {total > 1 && (
        <>
          <button onClick={prev} style={{
            position: "absolute", left: 12, top: "50%", transform: "translateY(-50%)",
            width: 44, height: 44, borderRadius: "50%",
            background: "rgba(0,0,0,0.55)", backdropFilter: "blur(8px)",
            border: "1px solid rgba(255,255,255,0.18)",
            color: "#fff", fontSize: 22, cursor: "pointer",
            display: "flex", alignItems: "center", justifyContent: "center",
          }}>‹</button>
          <button onClick={next} style={{
            position: "absolute", right: 12, top: "50%", transform: "translateY(-50%)",
            width: 44, height: 44, borderRadius: "50%",
            background: "rgba(0,0,0,0.55)", backdropFilter: "blur(8px)",
            border: "1px solid rgba(255,255,255,0.18)",
            color: "#fff", fontSize: 22, cursor: "pointer",
            display: "flex", alignItems: "center", justifyContent: "center",
          }}>›</button>
        </>
      )}

      {/* Закрити + Поділитись */}
      <div style={{ position: "absolute", top: 16, right: 16, display: "flex", gap: 8 }} onClick={e => e.stopPropagation()}>
        <button onClick={async (e) => {
          e.stopPropagation();
          const imgUrl = images[current];
          if (!imgUrl) return;
          const shareUrl = window.location.origin + window.location.pathname + "?tile=" + String(tile.id);
          // Спробуємо поширити зображення як файл (iOS Safari підтримує)
          if (navigator.share) {
            try {
              const res = await fetch(imgUrl);
              const blob = await res.blob();
              const ext = blob.type.includes("png") ? ".png" : ".jpg";
              const file = new File([blob], (tile.name || "tile") + ext, { type: blob.type });
              if (navigator.canShare && navigator.canShare({ files: [file] })) {
                await navigator.share({
                  title: tile.name + " — MS Ceramica",
                  text: tile.name + " · " + (tile.size || "") + " · " + tile.price.toLocaleString() + " грн/м²",
                  url: shareUrl,
                  files: [file],
                });
                return;
              }
            } catch(err) {
              if (err.name === "AbortError") return;
            }
            // Fallback — поширити без файлу
            try {
              await navigator.share({
                title: tile.name + " — MS Ceramica",
                text: tile.name + " · " + (tile.size || "") + " · " + tile.price.toLocaleString() + " грн/м²",
                url: shareUrl,
              });
            } catch(_) {}
          }
        }} style={{
          width: 40, height: 40, borderRadius: "50%",
          background: "rgba(0,0,0,0.6)", backdropFilter: "blur(10px)",
          border: "1px solid rgba(255,255,255,0.2)",
          color: "#fff", fontSize: 17, cursor: "pointer",
          display: "flex", alignItems: "center", justifyContent: "center",
        }}>⎙</button>
        <button onClick={onClose} style={{
          width: 40, height: 40, borderRadius: "50%",
          background: "rgba(0,0,0,0.6)", backdropFilter: "blur(10px)",
          border: "1px solid rgba(255,255,255,0.2)",
          color: "#fff", fontSize: 20, cursor: "pointer",
          display: "flex", alignItems: "center", justifyContent: "center",
        }}>×</button>
      </div>

      {/* Крапки-індикатори */}
      {total > 1 && (
        <div style={{
          position: "absolute", bottom: 100, left: 0, right: 0,
          display: "flex", justifyContent: "center", gap: 8,
        }} onClick={e => e.stopPropagation()}>
          {images.map((_, i) => (
            <div key={i} onClick={() => setCurrent(i)} style={{
              width: i === current ? 22 : 8,
              height: 8, borderRadius: 4,
              background: i === current ? "#c9a84c" : "rgba(255,255,255,0.4)",
              transition: "all 0.3s ease",
              cursor: "pointer",
            }} />
          ))}
        </div>
      )}

      {/* Назва внизу */}
      <div style={{
        position: "absolute", bottom: 0, left: 0, right: 0,
        padding: "40px 24px 32px",
        background: "linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 100%)",
        pointerEvents: "none",
      }}>
        {!hideInfo && <div style={{ color: "#c9a84c", fontSize: 11, letterSpacing: 2, textTransform: "uppercase", marginBottom: 4 }}>{tile.subtitle}</div>}
        {!hideInfo && <div style={{ color: "#fff", fontSize: 22, fontFamily: "serif", fontWeight: 700 }}>{tile.name}</div>}
        <div style={{ color: "#aaa", fontSize: 13, marginTop: 4 }}>{tile.size} · {tile.finish} · {current + 1}/{total}</div>
      </div>
    </div>
  );
}

    if (d.length < 10) return "Номер занадто короткий";
    return "";

  const hasTileData = tileArea > 0;

  const [width, setWidth] = useState("4");
  const [waste, setWaste] = useState(10);
  const [extraArea, setExtraArea] = useState(0); // ручне коригування м²
  const [phone, setPhone] = useState("");
  const [sending, setSending] = useState(false);
  const [sent, setSent] = useState(false);

  const roomArea = parseFloat(length || 0) * parseFloat(width || 0);
  const withWaste = roomArea > 0 ? roomArea * (1 + waste / 100) : 0;
  const baseArea = withWaste + extraArea;
  // Якщо є дані про плитку — округлюємо до цілих плиток
  const tileCount = hasTileData ? Math.ceil(baseArea / tileArea) : 0;
  const area = hasTileData ? tileCount * tileArea : baseArea;
  const totalPrice = area * tile.price;
  const enoughStock = area <= tile.stock;

  // Крок = площа однієї плитки (наприклад 0.72 м² для 120×60), або 1 м² якщо даних нема
  const areaStep = hasTileData ? tileArea : 1;

        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + SUPA_KEY, "apikey": SUPA_KEY },
        body: JSON.stringify({ action: "sendMessage", text: msg })

function getSaleInfo(tile) {
  if (!tile.salePrice && !tile.salePercent) return null;
  const now = new Date();
  if (tile.saleUntil) {
    const until = new Date(tile.saleUntil);
    until.setHours(23, 59, 59);
    if (now > until) return null; // акція закінчилась
  }
  const salePrice = tile.salePrice || Math.round(tile.price * (1 - tile.salePercent / 100));
  const percent = tile.salePercent || Math.round((1 - salePrice / tile.price) * 100);
  const daysLeft = tile.saleUntil ? Math.ceil((new Date(tile.saleUntil) - now) / (1000 * 60 * 60 * 24)) : null;
  return { salePrice, percent, daysLeft };
}

function StarRating({ rating, count, size = 13 }) {
  const full = Math.floor(rating);
  const half = rating - full >= 0.5;
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
      <div style={{ display: "flex", gap: 1 }}>
        {[1,2,3,4,5].map(i => (
          <span key={i} style={{ color: i <= full ? "#f4b942" : (i === full+1 && half ? "#f4b942" : "#333"), fontSize: size }}>
            {i <= full ? "★" : (i === full+1 && half ? "⭐" : "☆")}
          </span>
        ))}
      </div>
      <span style={{ color: "#f4b942", fontSize: size, fontWeight: 700 }}>{rating.toFixed(1)}</span>
      {count > 0 && <span style={{ color: "#444", fontSize: size - 2 }}>({count})</span>}
    </div>
  );
}

function StockBar({ stock, reserve, totalStock, unit, expectedDate, onIncoming }) {
  const total = totalStock || (stock + reserve);
  if (!total && !stock && !reserve) return null;

  const LIMIT = 200;

  // Визначаємо статус і колір по вільному залишку
  let statusColor, statusLabel, displayStock;
  if (stock <= 0 && reserve <= 0) {
    statusColor = "#555";
    statusLabel = "Немає";
    displayStock = null;
  } else if (stock <= 0 && reserve > 0) {
    statusColor = "#ff9800";
    statusLabel = "Є";
    displayStock = "0 " + unit;
  } else if (stock > LIMIT && unit !== "к-т") {
    statusColor = "#4caf50";
    statusLabel = "Багато";
    displayStock = LIMIT + "+ " + unit;
  } else if (stock > 10 || unit === "к-т") {
    statusColor = "#4caf50";
    statusLabel = "Є";
    displayStock = Number(stock).toFixed(2).replace(/\.00$/, "") + " " + unit;
  } else {
    statusColor = "#f44336";
    statusLabel = "Мало";
    displayStock = Number(stock).toFixed(2).replace(/\.00$/, "") + " " + unit;
  }

  const hasReserve = reserve > 0;

  return (
    <div style={{ padding: "8px 0 4px" }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
          <span style={{ width: 8, height: 8, borderRadius: "50%", background: statusColor, display: "inline-block", flexShrink: 0 }} />
          <span style={{ color: statusColor, fontSize: 12, fontWeight: 700 }}>{statusLabel}</span>
          {displayStock && (
            <span style={{ color: "#555", fontSize: 11 }}>· {displayStock}</span>
          )}
        </div>
        {hasReserve && (
          <span style={{ color: "#ff980077", fontSize: 10 }}>резерв {reserve.toLocaleString()} {unit}</span>
        )}
      </div>
      {expectedDate && (() => {
        const urgent = stock < 50;
        return (
          <div onClick={onIncoming ? (e) => { e.stopPropagation(); onIncoming(); } : undefined}
            style={{ marginTop: 4, display: "inline-block", background: urgent ? "#ff980018" : "#c9a84c18", border: "1px solid " + (urgent ? "#ff980066" : "#c9a84c44"), borderRadius: 6, padding: "2px 8px", cursor: onIncoming ? "pointer" : "default", animation: urgent ? "urgentPulse 1.4s ease-in-out infinite" : "none" }}>
            <span style={{ color: urgent ? "#ff9800" : "#c9a84c", fontSize: 10, fontWeight: 700 }}>
              {urgent ? "⚡" : "📦"} Очікується {new Date(expectedDate).toLocaleDateString("uk-UA", { day: "numeric", month: "short" })}
            </span>
          </div>
        );
      })()}
    </div>
  );
}

function ShareButton({ tile }) {
  const [copied, setCopied] = useState(false);

  const handleShare = async (e) => {
    e.stopPropagation();
    const url = window.location.origin + window.location.pathname + "?tile=" + String(tile.id);
    if (navigator.share) {
      try {
        await navigator.share({
          title: tile.name + " — MS Ceramica",
          text: tile.name + " · " + (tile.size || "") + " · " + tile.price.toLocaleString() + " грн/м²",
          url,
        });
      } catch(err) {
        // Користувач скасував або браузер відхилив — просто копіюємо
        if (err.name !== "AbortError") {
          try { await navigator.clipboard.writeText(url); setCopied(true); setTimeout(() => setCopied(false), 2000); } catch(_) {}
        }
      }
    } else {
      try {
        await navigator.clipboard.writeText(url);
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      } catch(_) {}
    }
  };

  return (
    <button
      onClick={handleShare}
      title="Поділитись товаром"
      style={{
        width: 34, height: 34, borderRadius: "50%", flexShrink: 0,
        background: copied ? "#4caf5022" : "#1a1a1a",
        border: "1px solid " + (copied ? "#4caf50" : "#2a2a2a"),
        color: copied ? "#4caf50" : "#666",
        cursor: "pointer", fontSize: 15,
        display: "flex", alignItems: "center", justifyContent: "center",
        transition: "all 0.2s",
      }}
      onMouseOver={e => { if (!copied) { e.currentTarget.style.borderColor="#c9a84c"; e.currentTarget.style.color="#c9a84c"; } }}
      onMouseOut={e => { if (!copied) { e.currentTarget.style.borderColor="#2a2a2a"; e.currentTarget.style.color="#666"; } }}
    >
      {copied ? "✓" : "⎙"}
    </button>
  );
}

              <button onClick={(e) => { e.stopPropagation(); onPanno && onPanno(tile); }} style={{ flex: 1, padding: "11px 0", borderRadius: 10, background: "linear-gradient(135deg, #c9a84c, #b8860b)", border: "none", color: "#000", cursor: "pointer", fontSize: 12, fontWeight: 800 }}>🎨 Підібрати плитку</button>
              <button onClick={(e) => { e.stopPropagation(); onOrder(tile); }} style={{ flex: 1, padding: "11px 0", borderRadius: 10, background: "transparent", border: "1px solid #c9a84c44", color: "#c9a84c", cursor: "pointer", fontSize: 12, fontWeight: 700 }}>🛒 Замовити</button>
            </>
          ) : (
            <>
              <button onClick={(e) => { e.stopPropagation(); onOrder(tile); }} style={{ flex: 1, padding: "11px 0", borderRadius: 10, background: "transparent", border: "1px solid #c9a84c44", color: "#c9a84c", cursor: "pointer", fontSize: 12, fontWeight: 700 }}>🛒 Замовити</button>
            </>
          )}
          </div>
        </div>
      </div>
    </div>
  );
}

function HeroBanner() {
  const [slides, setSlides] = React.useState([]);
  const [autoplay, setAutoplay] = React.useState(4);
  const [active, setActive] = React.useState(0);
  const [dragging, setDragging] = React.useState(false);
  const [startX, setStartX] = React.useState(0);
  const [offsetX, setOffsetX] = React.useState(0);
  const [transitioning, setTransitioning] = React.useState(true);
  const [zoom, setZoom] = React.useState(1);
  const [zx, setZx] = React.useState(0);
  const [zy, setZy] = React.useState(0);
  const [galleryOpen, setGalleryOpen] = React.useState(false);
  const [isDesk, setIsDesk] = React.useState(() => typeof window !== 'undefined' && window.innerWidth >= 769);
  const timerRef = React.useRef(null);
  const pinchRef = React.useRef({ dist: 0, startZoom: 1, panX: 0, panY: 0, lastX: 0, lastY: 0 });
  const movedRef = React.useRef(false);
  const startTimeRef = React.useRef(0);

  // Завантаження банерів із Supabase
  React.useEffect(() => {
    const load = async () => {
      try {
        const res = await fetch(
          "https://svbmamaqrtsknuztxiuq.supabase.co/rest/v1/banners?is_visible=eq.true&select=*&order=sort_order",
          { headers: { "apikey": SUPA_KEY, "Authorization": "Bearer " + SUPA_KEY } }
        );
        const data = await res.json();
        if (Array.isArray(data)) setSlides(data);

        const sres = await fetch(
          "https://svbmamaqrtsknuztxiuq.supabase.co/rest/v1/settings?key=eq.banner_autoplay&select=value",
          { headers: { "apikey": SUPA_KEY, "Authorization": "Bearer " + SUPA_KEY } }
        );
        const sdata = await sres.json();
        if (Array.isArray(sdata) && sdata[0]) setAutoplay(parseInt(sdata[0].value) || 4);
      } catch(e) { console.log("Banner load:", e); }
    };
    load();
  }, []);

  const next = React.useCallback(() => {
    setTransitioning(true);
    setActive(a => (a + 1) % Math.max(slides.length, 1));
    setOffsetX(0);
  }, [slides.length]);

  const goTo = (idx) => {
    setTransitioning(true);
    setActive((idx + slides.length) % slides.length);
    setOffsetX(0);
  };

  // Автопрокрутка з затримкою з адмінки
  React.useEffect(() => {
    if (slides.length <= 1) return;
    timerRef.current = setInterval(next, autoplay * 1000);
    return () => clearInterval(timerRef.current);
  }, [slides.length, autoplay, next]);

  const resetTimer = () => {
    clearInterval(timerRef.current);
    if (slides.length > 1) timerRef.current = setInterval(next, autoplay * 1000);
  };

  // Відстеження розміру екрану
  React.useEffect(() => {
    const handler = () => setIsDesk(window.innerWidth >= 769);
    window.addEventListener('resize', handler);
    return () => window.removeEventListener('resize', handler);
  }, []);

  const pinchDist = (t) => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);

  const onStart = (e) => {
    const touches = e.touches;
    if (touches && touches.length === 2) {
      // Початок зуму двома пальцями
      clearInterval(timerRef.current);
      pinchRef.current.dist = pinchDist(touches);
      pinchRef.current.startZoom = zoom;
      setDragging(false);
      setTransitioning(false);
      return;
    }
    setDragging(true);
    const x = touches ? touches[0].clientX : e.clientX;
    const y = touches ? touches[0].clientY : e.clientY;
    setStartX(x);
    pinchRef.current.lastX = x;
    pinchRef.current.lastY = y;
    movedRef.current = false;
    startTimeRef.current = Date.now();
    setTransitioning(false);
  };

  const onMove = (e) => {
    const touches = e.touches;
    // Зум двома пальцями
    if (touches && touches.length === 2) {
      if (e.cancelable) e.preventDefault();
      movedRef.current = true;
      let next = pinchRef.current.startZoom * (pinchDist(touches) / pinchRef.current.dist);
      next = Math.max(1, Math.min(next, 4));
      setZoom(next);
      if (next === 1) { setZx(0); setZy(0); }
      return;
    }
    if (!dragging) return;
    const x = touches ? touches[0].clientX : e.clientX;
    const y = touches ? touches[0].clientY : e.clientY;
    if (Math.abs(x - startX) > 8) movedRef.current = true;
    // Якщо збільшено — рухаємо фото всередині банера
    if (zoom > 1) {
      if (e.cancelable) e.preventDefault();
      const dx = x - pinchRef.current.lastX;
      const dy = y - pinchRef.current.lastY;
      pinchRef.current.lastX = x;
      pinchRef.current.lastY = y;
      setZx(v => v + dx);
      setZy(v => v + dy);
      return;
    }
    // Інакше — звичайний свайп каруселі
    setOffsetX(x - startX);
  };

  const onEnd = (e) => {
    // Якщо ще лишився один палець після зуму — нічого не робимо
    if (e.touches && e.touches.length > 0) return;
    if (zoom > 1) { setDragging(false); return; }
    if (!dragging) return;
    setDragging(false);
    setTransitioning(true);
    // Короткий тап без руху → відкрити галерею на весь екран
    const isTap = !movedRef.current && (Date.now() - startTimeRef.current) < 350;
    if (isTap) {
      setOffsetX(0);
      clearInterval(timerRef.current);
      setGalleryOpen(true);
      return;
    }
    if (offsetX < -60) { goTo(active + 1); resetTimer(); }
    else if (offsetX > 60) { goTo(active - 1); resetTimer(); }
    else setOffsetX(0);
  };

  // Подвійний тап — скинути зум
  const lastTapRef = React.useRef(0);
  const onDoubleTap = () => {
    const now = Date.now();
    if (now - lastTapRef.current < 300 && zoom > 1) {
      setZoom(1); setZx(0); setZy(0);
    }
    lastTapRef.current = now;
  };

  // Desktop: зум колесом миші прямо на банері
  const onWheelBanner = (e) => {
    e.preventDefault();
    clearInterval(timerRef.current);
    const delta = e.deltaY < 0 ? 0.25 : -0.25;
    setZoom(z => {
      const n = Math.max(1, Math.min(z + delta, 4));
      if (n === 1) { setZx(0); setZy(0); resetTimer(); }
      return n;
    });
  };

  // Якщо немає фото — показуємо placeholder тієї ж висоти щоб layout не стрибав
  if (slides.length === 0) return (
    <div style={{ width: "100%", height: "56vw", maxHeight: 440, minHeight: 200, background: "#0a0a0a" }} />
  );

  // ── ДЕСКТОП: великий + два маленьких ──
  if (isDesk && slides.length >= 1) {
    const left = slides[active % slides.length];
    const right = slides[(active + 1) % slides.length];
    return (
      <div style={{ width: "100%", display: "grid", gridTemplateColumns: "1fr 1fr", height: 380, gap: 3, background: "#0a0a0a" }}>
        {/* Лівий банер — активний */}
        <div
          style={{ position: "relative", overflow: "hidden", cursor: "pointer" }}
          onClick={() => { setGalleryOpen(true); clearInterval(timerRef.current); }}
        >
          <img src={left.image_url} alt={left.title || ""} draggable={false}
            style={{ width: "100%", height: "100%", objectFit: "cover", objectPosition: "center", display: "block", transition: "transform 0.6s ease" }}
            onMouseEnter={e => e.target.style.transform = "scale(1.03)"}
            onMouseLeave={e => e.target.style.transform = "scale(1)"}
          />
          <div style={{ position: "absolute", inset: 0, background: "linear-gradient(180deg, transparent 50%, rgba(0,0,0,0.7) 100%)", pointerEvents: "none" }} />
          {(left.title || left.subtitle) && (
            <div style={{ position: "absolute", bottom: 24, left: 24, pointerEvents: "none" }}>
              {left.title && <div style={{ color: "#fff", fontSize: 24, fontWeight: 900, fontFamily: "serif", lineHeight: 1.15, marginBottom: 6, textShadow: "0 2px 12px rgba(0,0,0,0.7)" }}>{left.title}</div>}
              {left.subtitle && <div style={{ color: "rgba(255,255,255,0.75)", fontSize: 13 }}>{left.subtitle}</div>}
            </div>
          )}
          {/* Крапки навігації */}
          {slides.length > 1 && (
            <div style={{ position: "absolute", bottom: 14, right: 14, display: "flex", gap: 5, zIndex: 5 }}>
              {slides.map((_, i) => (
                <div key={i} onClick={e => { e.stopPropagation(); goTo(i); resetTimer(); }} style={{
                  width: active === i ? 20 : 6, height: 6, borderRadius: 3,
                  background: active === i ? "#c9a84c" : "rgba(255,255,255,0.4)",
                  transition: "width 0.3s", cursor: "pointer",
                }} />
              ))}
            </div>
          )}
        </div>

        {/* Правий банер — наступний слайд */}
        <div
          style={{ position: "relative", overflow: "hidden", cursor: "pointer" }}
          onClick={() => { goTo((active + 1) % slides.length); resetTimer(); }}
        >
          <img src={right.image_url} alt={right.title || ""} draggable={false}
            style={{ width: "100%", height: "100%", objectFit: "cover", objectPosition: "center", display: "block", transition: "transform 0.6s ease", filter: "brightness(0.8)" }}
            onMouseEnter={e => { e.target.style.transform = "scale(1.03)"; e.target.style.filter = "brightness(1)"; }}
            onMouseLeave={e => { e.target.style.transform = "scale(1)"; e.target.style.filter = "brightness(0.8)"; }}
          />
          <div style={{ position: "absolute", inset: 0, background: "linear-gradient(180deg, transparent 50%, rgba(0,0,0,0.7) 100%)", pointerEvents: "none" }} />
          {(right.title || right.subtitle) && (
            <div style={{ position: "absolute", bottom: 24, left: 24, pointerEvents: "none" }}>
              {right.title && <div style={{ color: "#fff", fontSize: 24, fontWeight: 900, fontFamily: "serif", lineHeight: 1.15, marginBottom: 6, textShadow: "0 2px 12px rgba(0,0,0,0.7)" }}>{right.title}</div>}
              {right.subtitle && <div style={{ color: "rgba(255,255,255,0.75)", fontSize: 13 }}>{right.subtitle}</div>}
            </div>
          )}
          {/* Стрілка вперед */}
          <div style={{ position: "absolute", top: "50%", right: 16, transform: "translateY(-50%)", background: "rgba(0,0,0,0.5)", color: "rgba(255,255,255,0.7)", fontSize: 22, width: 36, height: 36, borderRadius: "50%", display: "flex", alignItems: "center", justifyContent: "center", backdropFilter: "blur(6px)", pointerEvents: "none" }}>›</div>
        </div>

        {/* Галерея */}
        {galleryOpen && (
          <BannerGallery
            slides={slides}
            startIndex={active}
            onClose={() => { setGalleryOpen(false); resetTimer(); }}
            onIndexChange={(i) => setActive(i)}
          />
        )}
      </div>
    );
  }

  // ── МОБІЛЬНА версія (каруселі, зум, свайп) ──
  return (
    <div
      className="hero-banner"
      style={{ position: "relative", width: "100%", height: "56vw", maxHeight: 440, minHeight: 200, overflow: "hidden", userSelect: "none", touchAction: "pan-y", background: "#0a0a0a" }}
      onMouseDown={onStart} onMouseMove={onMove} onMouseUp={onEnd} onMouseLeave={onEnd}
      onTouchStart={onStart} onTouchMove={onMove} onTouchEnd={onEnd}
      onWheel={onWheelBanner}
    >
      <style>{`
        @media (min-width: 769px) {
          .hero-banner {
            height: 360px !important;
            max-height: 360px !important;
            max-width: none !important;
            width: 100% !important;
            margin: 0 !important;
            border-radius: 0;
            overflow: hidden;
            display: block;
          }
          .hero-banner .banner-slide {
            width: 100% !important;
            height: 360px !important;
          }
          .hero-banner .banner-slide .banner-img {
            object-fit: contain !important;
            object-position: center !important;
          }
        }
      `}</style>
      {slides.map((s, i) => {
        const offset = i - active;
        const x = offset * 100 + (active === i ? (offsetX / window.innerWidth) * 100 : 0);
        return (
          <div key={s.id || i} className={"banner-slide" + (active === i ? " active" : "")} style={{
            position: "absolute", inset: 0,
            transform: `translateX(${x}%)`,
            transition: transitioning && !dragging ? "transform 0.5s cubic-bezier(.16,1,.3,1)" : "none",
          }}>
            <img src={s.image_url} alt={s.title || "банер"} draggable={false}
              className="banner-img"
              onClick={active === i ? onDoubleTap : undefined}
              style={{
                position: "absolute", inset: 0, width: "100%", height: "100%", objectFit: "cover", objectPosition: "center",
                transform: active === i && zoom > 1 ? `translate(${zx}px, ${zy}px) scale(${zoom})` : "none",
                transition: dragging ? "none" : "transform 0.15s ease",
                transformOrigin: "center center",
              }} />
            {(s.title || s.subtitle) && (
              <>
                <div style={{ position: "absolute", inset: 0, background: "linear-gradient(90deg, rgba(0,0,0,0.78) 0%, rgba(0,0,0,0.35) 55%, rgba(0,0,0,0.1) 100%)" }} />
                <div style={{ position: "absolute", inset: 0, display: "flex", flexDirection: "column", justifyContent: "center", padding: "24px 28px" }}>
                  {s.title && <div style={{ color: "#fff", fontSize: "clamp(20px, 5vw, 34px)", fontWeight: 900, fontFamily: "serif", lineHeight: 1.15, marginBottom: 8, maxWidth: 340, textShadow: "0 2px 12px rgba(0,0,0,0.6)" }}>{s.title}</div>}
                  {s.subtitle && <div style={{ color: "rgba(255,255,255,0.7)", fontSize: "clamp(12px, 3vw, 16px)", maxWidth: 300, textShadow: "0 1px 8px rgba(0,0,0,0.6)" }}>{s.subtitle}</div>}
                </div>
              </>
            )}
          </div>
        );
      })}

      {/* Крапки */}
      {slides.length > 1 && (
        <div style={{ position: "absolute", bottom: 14, left: "50%", transform: "translateX(-50%)", display: "flex", gap: 6, zIndex: 5 }}>
          {slides.map((_, i) => (
            <div key={i} onClick={() => { goTo(i); resetTimer(); }} style={{
              width: active === i ? 22 : 6, height: 6, borderRadius: 3,
              background: active === i ? "#c9a84c" : "rgba(255,255,255,0.35)",
              transition: "width 0.3s, background 0.3s", cursor: "pointer",
            }} />
          ))}
        </div>
      )}

      {/* Стрілки */}
      {slides.length > 1 && (
        <>
          <button onClick={() => { goTo(active - 1); resetTimer(); }} style={{ position: "absolute", left: 12, top: "50%", transform: "translateY(-50%)", width: 36, height: 36, borderRadius: "50%", background: "rgba(0,0,0,0.5)", border: "1px solid rgba(255,255,255,0.15)", color: "#fff", fontSize: 18, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", backdropFilter: "blur(8px)", zIndex: 5 }}>‹</button>
          <button onClick={() => { goTo(active + 1); resetTimer(); }} style={{ position: "absolute", right: 12, top: "50%", transform: "translateY(-50%)", width: 36, height: 36, borderRadius: "50%", background: "rgba(0,0,0,0.5)", border: "1px solid rgba(255,255,255,0.15)", color: "#fff", fontSize: 18, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", backdropFilter: "blur(8px)", zIndex: 5 }}>›</button>
        </>
      )}

      {/* Повноекранний перегляд із зумом */}
      {/* Підказка про зум (тільки коли збільшено) */}
      {zoom > 1 && (
        <div style={{ position: "absolute", top: 10, left: "50%", transform: "translateX(-50%)", background: "rgba(0,0,0,0.55)", color: "rgba(255,255,255,0.85)", fontSize: 11, padding: "4px 12px", borderRadius: 20, backdropFilter: "blur(8px)", zIndex: 6, whiteSpace: "nowrap" }}>
          {Math.round(zoom * 100)}% · подвійний тап щоб скинути
        </div>
      )}

      {/* Повноекранна галерея */}
      {galleryOpen && (
        <BannerGallery
          slides={slides}
          startIndex={active}
          onClose={() => { setGalleryOpen(false); resetTimer(); }}
          onIndexChange={(i) => setActive(i)}
        />
      )}
    </div>
  );
}

function BannerGallery({ slides, startIndex, onClose, onIndexChange }) {
  const [idx, setIdx] = React.useState(startIndex);
  const [scale, setScale] = React.useState(1);
  const [tx, setTx] = React.useState(0);
  const [ty, setTy] = React.useState(0);
  const [offsetX, setOffsetX] = React.useState(0);
  const [dragging, setDragging] = React.useState(false);
  const g = React.useRef({ startX: 0, lastX: 0, lastY: 0, pinchDist: 0, startScale: 1, moved: false, panning: false });
  const lastTap = React.useRef(0);
  const mouseRef = React.useRef({ down: false, startX: 0, lastX: 0, lastY: 0, moved: false });
  const idxRef = React.useRef(startIndex);
  React.useEffect(() => { idxRef.current = idx; }, [idx]);

  // Клавіатура: ← → гортання, Esc закрити, +/- зум
  React.useEffect(() => {
    const onKey = (e) => {
      if (e.key === "Escape") onClose();
      else if (e.key === "ArrowRight") goTo(idxRef.current + 1);
      else if (e.key === "ArrowLeft") goTo(idxRef.current - 1);
      else if (e.key === "+" || e.key === "=") setScale(s => Math.min(s + 0.5, 5));
      else if (e.key === "-") setScale(s => { const n = Math.max(s - 0.5, 1); if (n === 1) { setTx(0); setTy(0); } return n; });
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, []);

  const dist = (t) => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);

  const goTo = (i) => {
    const ni = (i + slides.length) % slides.length;
    setIdx(ni); setScale(1); setTx(0); setTy(0); setOffsetX(0);
    onIndexChange && onIndexChange(ni);
  };

  const onStart = (e) => {
    const t = e.touches;
    g.current.moved = false;
    if (t.length === 2) {
      g.current.pinchDist = dist(t);
      g.current.startScale = scale;
    } else if (t.length === 1) {
      g.current.startX = t[0].clientX;
      g.current.lastX = t[0].clientX;
      g.current.lastY = t[0].clientY;
      g.current.panning = scale > 1;
      setDragging(true);
    }
  };
  const onMove = (e) => {
    const t = e.touches;
    if (t.length === 2) {
      if (e.cancelable) e.preventDefault();
      g.current.moved = true;
      let next = g.current.startScale * (dist(t) / g.current.pinchDist);
      next = Math.max(1, Math.min(next, 5));
      setScale(next);
      if (next === 1) { setTx(0); setTy(0); }
      return;
    }
    if (t.length === 1) {
      const x = t[0].clientX, y = t[0].clientY;
      if (Math.abs(x - g.current.startX) > 8) g.current.moved = true;
      if (scale > 1) {
        // рух збільшеного фото
        if (e.cancelable) e.preventDefault();
        const dx = x - g.current.lastX, dy = y - g.current.lastY;
        g.current.lastX = x; g.current.lastY = y;
        setTx(v => v + dx); setTy(v => v + dy);
      } else {
        // свайп між фото
        setOffsetX(x - g.current.startX);
      }
    }
  };
  const onEnd = (e) => {
    if (e.touches.length > 0) return;
    setDragging(false);
    g.current.panning = false;
    if (scale > 1) return;
    if (offsetX < -60) goTo(idx + 1);
    else if (offsetX > 60) goTo(idx - 1);
    else setOffsetX(0);
  };
  const onTap = () => {
    const now = Date.now();
    if (now - lastTap.current < 300) {
      if (scale > 1) { setScale(1); setTx(0); setTy(0); }
      else setScale(2.5);
    }
    lastTap.current = now;
  };

  // ── Desktop: миша і колесо ──
  const onWheel = (e) => {
    e.preventDefault();
    const delta = e.deltaY < 0 ? 0.2 : -0.2;
    setScale(s => {
      const n = Math.max(1, Math.min(s + delta, 5));
      if (n === 1) { setTx(0); setTy(0); }
      return n;
    });
  };
  const onMouseDown = (e) => {
    mouseRef.current = { down: true, startX: e.clientX, lastX: e.clientX, lastY: e.clientY, moved: false };
    setDragging(true);
  };
  const onMouseMove = (e) => {
    if (!mouseRef.current.down) return;
    if (Math.abs(e.clientX - mouseRef.current.startX) > 8) mouseRef.current.moved = true;
    if (scale > 1) {
      const dx = e.clientX - mouseRef.current.lastX, dy = e.clientY - mouseRef.current.lastY;
      mouseRef.current.lastX = e.clientX; mouseRef.current.lastY = e.clientY;
      setTx(v => v + dx); setTy(v => v + dy);
    } else {
      setOffsetX(e.clientX - mouseRef.current.startX);
    }
  };
  const onMouseUp = () => {
    if (!mouseRef.current.down) return;
    mouseRef.current.down = false;
    setDragging(false);
    if (scale > 1) return;
    if (offsetX < -60) goTo(idx + 1);
    else if (offsetX > 60) goTo(idx - 1);
    else setOffsetX(0);
  };

  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.97)", zIndex: 2000, overflow: "hidden", touchAction: "none", cursor: scale > 1 ? "grab" : "default" }}
      onTouchStart={onStart} onTouchMove={onMove} onTouchEnd={onEnd}
      onWheel={onWheel} onMouseDown={onMouseDown} onMouseMove={onMouseMove} onMouseUp={onMouseUp} onMouseLeave={onMouseUp}>

      {/* Слайди */}
      {slides.map((s, i) => {
        const off = (i - idx) * 100 + (i === idx && scale === 1 ? (offsetX / window.innerWidth) * 100 : 0);
        return (
          <div key={s.id || i} style={{
            position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center",
            transform: `translateX(${off}%)`,
            transition: dragging ? "none" : "transform 0.35s cubic-bezier(.16,1,.3,1)",
          }}>
            <img src={s.image_url} alt={s.title || "фото"} draggable={false}
              onClick={i === idx ? onTap : undefined}
              style={{
                maxWidth: "100%", maxHeight: "100%", objectFit: "contain",
                transform: i === idx && scale > 1 ? `translate(${tx}px, ${ty}px) scale(${scale})` : "none",
                transition: dragging ? "none" : "transform 0.15s ease",
              }} />
          </div>
        );
      })}

      {/* Стрілки (desktop) */}
      {slides.length > 1 && (
        <>
          <button onClick={(e) => { e.stopPropagation(); goTo(idx - 1); }} style={{ position: "absolute", left: 20, top: "50%", transform: "translateY(-50%)", width: 48, height: 48, borderRadius: "50%", background: "rgba(255,255,255,0.1)", border: "1px solid rgba(255,255,255,0.2)", color: "#fff", fontSize: 24, cursor: "pointer", backdropFilter: "blur(8px)", zIndex: 5, display: "flex", alignItems: "center", justifyContent: "center" }}>‹</button>
          <button onClick={(e) => { e.stopPropagation(); goTo(idx + 1); }} style={{ position: "absolute", right: 20, top: "50%", transform: "translateY(-50%)", width: 48, height: 48, borderRadius: "50%", background: "rgba(255,255,255,0.1)", border: "1px solid rgba(255,255,255,0.2)", color: "#fff", fontSize: 24, cursor: "pointer", backdropFilter: "blur(8px)", zIndex: 5, display: "flex", alignItems: "center", justifyContent: "center" }}>›</button>
        </>
      )}

      {/* Закрити */}
      <button onClick={onClose} style={{ position: "absolute", top: 16, right: 16, width: 44, height: 44, borderRadius: "50%", background: "rgba(255,255,255,0.12)", border: "1px solid rgba(255,255,255,0.25)", color: "#fff", fontSize: 24, cursor: "pointer", backdropFilter: "blur(8px)", zIndex: 5 }}>×</button>

      {/* Лічильник */}
      {slides.length > 1 && (
        <div style={{ position: "absolute", top: 22, left: "50%", transform: "translateX(-50%)", color: "rgba(255,255,255,0.7)", fontSize: 13, background: "rgba(0,0,0,0.4)", padding: "3px 12px", borderRadius: 20, backdropFilter: "blur(8px)" }}>{idx + 1} / {slides.length}</div>
      )}

      {/* Крапки */}
      {slides.length > 1 && (
        <div style={{ position: "absolute", bottom: 28, left: "50%", transform: "translateX(-50%)", display: "flex", gap: 7, zIndex: 5 }}>
          {slides.map((_, i) => (
            <div key={i} onClick={() => goTo(i)} style={{ width: idx === i ? 22 : 7, height: 7, borderRadius: 4, background: idx === i ? "#c9a84c" : "rgba(255,255,255,0.35)", transition: "all 0.3s", cursor: "pointer" }} />
          ))}
        </div>
      )}

      {/* Підказка */}
      <div style={{ position: "absolute", bottom: 52, left: "50%", transform: "translateX(-50%)", color: "rgba(255,255,255,0.4)", fontSize: 11, whiteSpace: "nowrap", textAlign: "center" }}>
        Гортайте · колесо або два пальці — збільшити · Esc / × — закрити
      </div>
    </div>
  );
}

function TileCatalog() {
  const { collections, pannos, loading } = useCollections();
  const [activeFilters, setActiveFilters] = useState([]);
  const [ordering, setOrdering] = useState(null);
  const [viewing3D, setViewing3D] = useState(null);
  const [search, setSearch] = useState("");
  const [activeCard, setActiveCard] = useState(0);
  const [navOpen, setNavOpen] = useState(false);
  const [calcTile, setCalcTile] = useState(null);
  const [warehouseMode, setWarehouseMode] = useState(false);
  const [pannoModal, setPannoModal] = useState(null);
  const [priceRange, setPriceRange] = useState([0, 999999]);
  const [infoPage, setInfoPage] = useState(null);
  const [incomingModal, setIncomingModal] = useState(false);
  const cardRefs = useRef({});

  const scrollToCard = (id) => {
    const el = cardRefs.current[id];
    if (el) {
      el.scrollIntoView({ behavior: "smooth", block: "center" });
      setActiveCard(id);
    }
  };

  // Читаємо ?tile= один раз при монтуванні і зберігаємо
  const targetTileId = useRef((() => {
    try {
      const p = new URLSearchParams(window.location.search).get("tile");
      if (p) window.history.replaceState({}, "", window.location.pathname);
      return p ? (isNaN(p) ? p : Number(p)) : null;
    } catch(_) { return null; }
  })());
  const scrolledRef = useRef(false);
  const scrollTimers = useRef([]);

  // Скролимо тільки після повного завантаження (loading=false) і коли ref є в DOM
  useEffect(() => {
    if (!targetTileId.current || scrolledRef.current || loading) return;
    const id = targetTileId.current;
    // Невеликий timeout щоб React встиг оновити DOM після останнього setState
    const t = setTimeout(() => {
      const el = cardRefs.current[id];
      if (!el) return;
      scrolledRef.current = true;
      setActiveCard(id);

      const doScroll = () => {
        const el2 = cardRefs.current[id];
        if (!el2) return;
        try {
          const rect = el2.getBoundingClientRect();
          if (rect.width === 0 && rect.height === 0) return;
          const scrollY = window.pageYOffset + rect.top - (window.innerHeight / 2) + (rect.height / 2);
          window.scrollTo({ top: Math.max(0, scrollY) });
        } catch(_) {}
      };

      // Два скроли: одразу + після завантаження зображень
      doScroll();
      scrollTimers.current.push(setTimeout(doScroll, 1500));
    }, 100);
    scrollTimers.current.push(t);

    return () => { scrollTimers.current.forEach(clearTimeout); scrollTimers.current = []; };
  }, [loading]);
  // Динамічні фільтри з усіх тегів + Панно окремо
  const allTags = Array.from(new Set(
    [...collections, ...pannos].flatMap(c => c.tags || [])
  )).filter(t => t).sort();
  const filters = ["Всі", "Панно", ...allTags.filter(t => t !== "Панно")];
  const allItems = [...collections, ...pannos];
  const allPrices = allItems.map(t => t.price).filter(p => p > 0);
  const minPrice = allPrices.length ? Math.min(...allPrices) : 0;
  const maxPrice = allPrices.length ? Math.max(...allPrices) : 99999;

  // Перемикання тегу: "Всі" скидає вибір, інші додаються/знімаються
  const toggleFilter = (f) => {
    if (f === "Всі") { setActiveFilters([]); return; }
    setActiveFilters(prev =>
      prev.includes(f) ? prev.filter(x => x !== f) : [...prev, f]
    );
  };

  const filtered = allItems.filter(t => {
    // Якщо нічого не вибрано — показуємо все
    const matchFilter = activeFilters.length === 0 || activeFilters.every(f =>
      f === "Панно" ? t.isPanno : (t.tags || []).includes(f)
    );
    const matchSearch = t.name.toLowerCase().includes(search.toLowerCase()) || 
      (t.subtitle || "").toLowerCase().includes(search.toLowerCase());
    const effectivePrice = (() => { const s = getSaleInfo(t); return s ? s.salePrice : t.price; })();
    const matchPrice = effectivePrice >= priceRange[0] && effectivePrice <= priceRange[1];
    return matchFilter && matchSearch && matchPrice;
  });

  return (
    <div style={{ minHeight: "100vh", background: "#0a0a0a", fontFamily: "sans-serif", color: "#fff" }}>
      <style>{`
        @keyframes fadeIn { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:none; } }
        @keyframes pulse { 0%,100% { opacity:0.6; } 50% { opacity:1; } }
        @keyframes urgentPulse { 0%,100% { opacity:1; box-shadow: 0 0 0 0 rgba(255,152,0,0); } 50% { opacity:0.7; box-shadow: 0 0 6px 2px rgba(255,152,0,0.4); } }
        @keyframes fadeSlide { from { opacity:0; transform:translateX(30px); } to { opacity:1; transform:none; } }
        @keyframes slideIn { from { transform:translateX(100%); } to { transform:translateX(0); } }
        @keyframes slideUp { from { transform:translateY(100%); opacity:0; } to { transform:translateY(0); opacity:1; } }
        @keyframes calcPulse {
          0%, 100% { box-shadow: 0 0 0 0 rgba(201,168,76,0.4); border-color: #c9a84c66; }
          50% { box-shadow: 0 0 0 6px rgba(201,168,76,0); border-color: #c9a84c; }
        }
        * { box-sizing: border-box; }
      `}</style>

      {/* Header */}
      <div style={{ borderBottom: "1px solid #141414", padding: "16px 24px", display: "flex", alignItems: "center", justifyContent: "space-between", position: "sticky", top: 0, background: "#0a0a0aee", backdropFilter: "blur(20px)", zIndex: 100 }}>
        <style>{`
          @keyframes phonePulse {
            0%   { color: #c9a84c; text-shadow: 0 0 0px rgba(201,168,76,0); }
            50%  { color: #FFE066; text-shadow: 0 0 12px rgba(255,224,102,0.8), 0 0 24px rgba(201,168,76,0.4); }
            100% { color: #c9a84c; text-shadow: 0 0 0px rgba(201,168,76,0); }
          }
          .phone-blink { animation: phonePulse 2s ease-in-out infinite; }
        `}</style>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <button onClick={() => window.__openChat && window.__openChat()} style={{
            width: 38, height: 38, borderRadius: "50%",
            background: "linear-gradient(135deg, #229ED9, #1a7fb5)",
            border: "none", cursor: "pointer",
            boxShadow: "0 4px 14px rgba(34,158,217,0.4)",
            display: "flex", alignItems: "center", justifyContent: "center",
            fontSize: 18, flexShrink: 0,
          }}>💬</button>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <button onClick={() => setWarehouseMode(v => !v)} style={{
            padding: "6px 12px", borderRadius: 20, border: "1px solid",
            borderColor: warehouseMode ? "#7b68ee" : "#2a2a2a",
            background: warehouseMode ? "#7b68ee22" : "transparent",
            color: warehouseMode ? "#7b68ee" : "#555",
            cursor: "pointer", fontSize: 11, fontWeight: 700,
          }}>
            {warehouseMode ? "📦 Склад" : "👁 Повний"}
          </button>
          <button onClick={() => window.location.href = "admin.html"} style={{
            width: 32, height: 32, borderRadius: "50%", border: "1px solid #2a2a2a",
            background: "transparent", color: "#333", cursor: "pointer",
            fontSize: 16, display: "flex", alignItems: "center", justifyContent: "center",
          }} title="Адмінка">⚙️</button>
        </div>
      </div>

      {/* Hero Swipe Banner */}
      <HeroBanner />

      {/* Stats */}
      <div style={{ padding: "32px 24px 24px", background: "linear-gradient(180deg, #0f0e0a 0%, #0a0a0a 100%)" }}>
        <div style={{ display: "flex", gap: 24, marginBottom: 24, flexWrap: "wrap" }}>
          {[
            [loading ? "..." : collections.length + pannos.length, "Колекцій"],
            [(() => {
              const now = new Date();
              const h = now.getHours().toString().padStart(2,"0");
              const m = now.getMinutes().toString().padStart(2,"0");
              return "оновлено о " + h + ":" + m;
            })(), "✦ Ексклюзивні колекції"]
          ].map(([v, l], i) => (
            <div key={i} style={{ flex: 1, minWidth: 120, background: "#111", borderRadius: 12, padding: 16, border: "1px solid #1a1a1a" }}>
              <div style={{ color: "#c9a84c", fontSize: i===0 ? 22 : 11, fontWeight: i===0 ? 800 : 400, letterSpacing: i===1 ? 1 : 0 }}>{v}</div>
              <div style={{ color: "#555", fontSize: 11, marginTop: 2 }}>{l}</div>
            </div>
          ))}
        </div>
        <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Пошук колекції..." style={{ width: "100%", padding: "12px 16px", borderRadius: 12, background: "#111", border: "1px solid #1e1e1e", color: "#fff", fontSize: 13, outline: "none", marginBottom: 16 }} />
        <div style={{ display: "flex", gap: 8, overflowX: "auto", paddingBottom: 4 }}>
          {filters.map(f => {
            const isAll = f === "Всі";
            const on = isAll ? activeFilters.length === 0 : activeFilters.includes(f);
            return (
              <button key={f} onClick={() => toggleFilter(f)} style={{ whiteSpace: "nowrap", padding: "7px 16px", borderRadius: 20, border: "1px solid", borderColor: on ? "#c9a84c" : "#1e1e1e", background: on ? "#c9a84c" : "transparent", color: on ? "#000" : "#555", cursor: "pointer", fontSize: 12, fontWeight: 700 }}>
                {!isAll && on ? "✓ " : ""}{f}
              </button>
            );
          })}
        </div>
        {activeFilters.length > 0 && (
          <div style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 8 }}>
            <span style={{ color: "#555", fontSize: 11 }}>Вибрано: {activeFilters.join(" + ")}</span>
            <button onClick={() => setActiveFilters([])} style={{ background: "transparent", border: "1px solid #2a2a2a", color: "#777", cursor: "pointer", fontSize: 11, padding: "3px 10px", borderRadius: 12 }}>✕ Скинути</button>
          </div>
        )}

        {/* Фільтр за ціною */}
        <div style={{ marginTop: 16, background: "#111", borderRadius: 14, padding: "14px 16px", border: "1px solid #1a1a1a" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
            <span style={{ color: "#777", fontSize: 12 }}>💰 Ціна за м²</span>
            <span style={{ color: "#c9a84c", fontSize: 13, fontWeight: 700 }}>
              {priceRange[0].toLocaleString()} — {priceRange[1] >= 999999 ? "∞" : priceRange[1].toLocaleString()} грн
            </span>
          </div>
          {/* Від */}
          <div style={{ marginBottom: 8 }}>
            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 4 }}>
              <span style={{ color: "#444", fontSize: 10 }}>Від</span>
              <span style={{ color: "#666", fontSize: 10 }}>{priceRange[0].toLocaleString()} грн</span>
            </div>
            <input type="range"
              min={0} max={maxPrice || 99999} step={50}
              value={priceRange[0]}
              onChange={e => {
                const val = Number(e.target.value);
                if (val < priceRange[1]) setPriceRange([val, priceRange[1]]);
              }}
              style={{ width: "100%", accentColor: "#c9a84c", cursor: "pointer" }}
            />
          </div>
          {/* До */}
          <div>
            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 4 }}>
              <span style={{ color: "#444", fontSize: 10 }}>До</span>
              <span style={{ color: "#666", fontSize: 10 }}>{priceRange[1].toLocaleString()} грн</span>
            </div>
            <input type="range"
              min={0} max={maxPrice || 99999} step={50}
              value={priceRange[1]}
              onChange={e => {
                const val = Number(e.target.value);
                if (val > priceRange[0]) setPriceRange([priceRange[0], val]);
              }}
              style={{ width: "100%", accentColor: "#c9a84c", cursor: "pointer" }}
            />
          </div>
          {/* Скинути */}
          {(priceRange[0] !== 0 || priceRange[1] !== 999999) && (
            <button onClick={() => setPriceRange([0, 999999])} style={{
              marginTop: 10, padding: "5px 12px", borderRadius: 8,
              background: "transparent", border: "1px solid #2a2a2a",
              color: "#555", cursor: "pointer", fontSize: 11,
            }}>✕ Скинути фільтр</button>
          )}
        </div>
      </div>

      {/* Grid */}
      <div style={{ padding: "8px 24px 40px", display: "grid", gap: 20, gridTemplateColumns: "repeat(auto-fill, minmax(300px, 1fr))" }}>
        {loading && filtered.length === 0 && (
          <div style={{ gridColumn: "1/-1", textAlign: "center", padding: 40 }}>
            <div style={{ color: "#c9a84c", fontSize: 13, animation: "pulse 1.5s infinite" }}>⟳ Завантаження колекцій...</div>
          </div>
        )}
        {filtered.map((tile, i) => (
          <div key={tile.id} ref={el => cardRefs.current[tile.id] = el} style={{ animation: `fadeIn 0.4s ease both`, animationDelay: targetTileId.current ? "0s" : `${i * 0.08}s` }}>
            <TileCard tile={tile} onOrder={setOrdering} onView3D={setViewing3D} onCalc={setCalcTile} onPanno={tile.isPanno ? setPannoModal : null} warehouseMode={warehouseMode} onIncoming={() => setIncomingModal(tile)} />
          </div>
        ))}
      </div>

      <div style={{ borderTop: "1px solid #141414", padding: "12px 24px", textAlign: "center" }}>
        <div style={{ color: "#333", fontSize: 11 }}>Тільки для гуртових клієнтів · Мінімальне замовлення від 30 м²</div>
      </div>

      <SiteFooter onOpenPage={setInfoPage} />

      {/* Плаваюча кнопка навігації */}
      <button
        onClick={() => setNavOpen(true)}
        style={{
          position: "fixed", bottom: 28, right: 20, zIndex: 600,
          width: 52, height: 52, borderRadius: "50%",
          background: "linear-gradient(135deg, #c9a84c, #b8860b)",
          border: "none", cursor: "pointer",
          boxShadow: "0 4px 20px rgba(201,168,76,0.5)",
          display: "flex", alignItems: "center", justifyContent: "center",
          fontSize: 22,
        }}
      >☰</button>

      {/* Кнопка переходу на склад */}
      <a
        href="/warehouse.html"
        style={{
          position: "fixed", bottom: 90, right: 20, zIndex: 600,
          width: 52, height: 52, borderRadius: "50%",
          background: "#1a1a2e",
          border: "2px solid #2a2a4a",
          boxShadow: "0 4px 16px rgba(0,0,0,0.4)",
          display: "flex", alignItems: "center", justifyContent: "center",
          fontSize: 22, textDecoration: "none",
          title: "Склад",
        }}
        title="Склад"
      >🏭</a>

      {/* Drawer навігація */}
      {navOpen && (
        <>
          {/* Затемнення фону */}
          <div onClick={() => setNavOpen(false)} style={{
            position: "fixed", inset: 0, zIndex: 700,
            background: "rgba(0,0,0,0.6)", backdropFilter: "blur(4px)",
          }} />

          {/* Панель */}
          <div style={{
            position: "fixed", top: 0, right: 0, bottom: 0, zIndex: 800,
            width: "min(320px, 85vw)",
            background: "#0f0f0f",
            borderLeft: "1px solid #2a2a2a",
            display: "flex", flexDirection: "column",
            animation: "slideIn 0.28s cubic-bezier(0.23,1,0.32,1)",
          }}>
            {/* Шапка панелі */}
            <div style={{
              padding: "20px 18px 14px",
              borderBottom: "1px solid #1a1a1a",
              display: "flex", justifyContent: "space-between", alignItems: "center",
              flexShrink: 0,
            }}>
              <div>
                <div style={{ color: "#c9a84c", fontSize: 10, letterSpacing: 2, textTransform: "uppercase" }}>Швидка навігація</div>
                <div style={{ color: "#fff", fontSize: 16, fontWeight: 700, marginTop: 2 }}>{collections.length} колекції</div>
              </div>
              <button onClick={() => setNavOpen(false)} style={{
                background: "#1a1a1a", border: "none", color: "#666",
                cursor: "pointer", width: 34, height: 34, borderRadius: "50%",
                fontSize: 18, display: "flex", alignItems: "center", justifyContent: "center",
              }}>×</button>
            </div>

            {/* Список колекцій */}
            <div style={{ overflowY: "auto", flex: 1, padding: "8px 0" }}>
              {collections.map((tile, i) => (
                <div
                  key={tile.id}
                  onClick={() => {
                    setNavOpen(false);
                    setTimeout(() => {
                      const el = cardRefs.current[tile.id];
                      if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
                      setActiveCard(tile.id);
                    }, 200);
                  }}
                  style={{
                    display: "flex", alignItems: "center", gap: 12,
                    padding: "10px 18px", cursor: "pointer",
                    background: activeCard === tile.id ? "#c9a84c11" : "transparent",
                    borderLeft: `3px solid ${activeCard === tile.id ? "#c9a84c" : "transparent"}`,
                    transition: "all 0.15s",
                  }}
                >
                  {/* Мініатюра */}
                  <div style={{ width: 48, height: 56, borderRadius: 8, overflow: "hidden", flexShrink: 0, border: activeCard === tile.id ? "1px solid #c9a84c" : "1px solid #2a2a2a" }}>
                    <img src={tile.image} alt={tile.name} style={{ width: "100%", height: "100%", objectFit: "cover" }} />
                  </div>
                  {/* Інфо */}
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ color: activeCard === tile.id ? "#c9a84c" : "#fff", fontSize: 13, fontWeight: 700, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{tile.name}</div>
                    <div style={{ color: "#555", fontSize: 11, marginTop: 2 }}>{tile.size}</div>
                    <div style={{ color: "#c9a84c", fontSize: 12, fontWeight: 700, marginTop: 2 }}>{tile.price.toLocaleString()} грн/м²</div>
                  </div>
                  {/* Номер */}
                  <div style={{ color: "#333", fontSize: 12, fontWeight: 700, flexShrink: 0 }}>#{i + 1}</div>
                </div>
              ))}
            </div>

            {/* Інформаційні посилання в drawer */}
            <div style={{ borderTop: "1px solid #1a1a1a", padding: "12px 14px", flexShrink: 0 }}>
              <div style={{ color: "#333", fontSize: 10, letterSpacing: 1, textTransform: "uppercase", marginBottom: 8 }}>Інформація</div>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 6 }}>
                {[
                  { href: "/delivery.html", label: "🚚 Доставка" },
                  { href: "/payment.html", label: "💳 Оплата" },
                  { href: "/returns.html", label: "🔄 Повернення" },
                  { href: "/contacts.html", label: "📞 Контакти" },
                ].map(({ href, label }) => (
                  <a key={href} href={href} style={{
                    background: "#111", border: "1px solid #1e1e1e",
                    borderRadius: 10, padding: "8px 10px",
                    color: "#666", fontSize: 11, textDecoration: "none", display: "block",
                  }}>{label}</a>
                ))}
              </div>
            </div>
          </div>
        </>
      )}

      {viewing3D && <TileViewer tile={viewing3D} onClose={() => setViewing3D(null)} hideInfo={warehouseMode} />}
      {calcTile && <RoomCalculator tile={calcTile} onClose={() => setCalcTile(null)} />}
      {pannoModal && <PannoModal panno={pannoModal} collections={collections} onClose={() => setPannoModal(null)} />}
      <LiveChat />

      {ordering && <OrderModal tile={ordering} onClose={() => setOrdering(null)} />}
      {infoPage && <InfoModal page={infoPage} onClose={() => setInfoPage(null)} />}
      {incomingModal && <IncomingModal tiles={[...collections, ...pannos].filter(t => t.expectedDate)} activeTile={incomingModal !== true ? incomingModal : null} onClose={() => setIncomingModal(false)} />}
    </div>
  );
}



    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<TileCatalog />);
  </script>
</body>
</html>
