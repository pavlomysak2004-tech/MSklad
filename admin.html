const api = async (method, path, body) => {
  const res = await fetch(SUPABASE_URL + "/rest/v1/" + path, {
    method,
    headers: {
      "apikey": SUPABASE_KEY,
      "Authorization": "Bearer " + SUPABASE_KEY,
      "Content-Type": "application/json",
      "Prefer": (method === "POST" || method === "PATCH") ? "return=representation" : ""
    },
    body: body ? JSON.stringify(body) : undefined
  });
  if (!res.ok) { const e = await res.text(); throw new Error(e); }
  return res.status === 204 ? null : res.json();
};

const uploadPhoto = async (file, collectionId) => {
  const ext = file.name.split(".").pop();
  const path = `collections/${collectionId}/${Date.now()}.${ext}`;
  const res = await fetch(`${SUPABASE_URL}/storage/v1/object/Photos/${path}`, {
    method: "POST",
    headers: {
      "apikey": SUPABASE_KEY,
      "Authorization": "Bearer " + SUPABASE_KEY,
      "Content-Type": file.type
    },
    body: file
  });
  if (!res.ok) { const err = await res.text(); throw new Error('Upload: ' + err); }
  return `${SUPABASE_URL}/storage/v1/object/public/Photos/${path}`;
};

const getNBURate = async () => {
  try {
    const res = await fetch("https://bank.gov.ua/NBUStatService/v1/statdirectory/exchange?json");
    const data = await res.json();
    const eur = data.find(x => x.cc === "EUR");
    const usd = data.find(x => x.cc === "USD");
    return { eur: eur?.rate || 43.5, usd: usd?.rate || 41.2 };
  } catch { return { eur: 43.5, usd: 41.2 }; }
};


function showToast(msg, type) {
  let t = document.getElementById("toast");
  if (!t) {
    t = document.createElement("div");
    t.id = "toast";
    t.className = "toast";
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.className = "toast " + (type || "");
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 3000);
}

function renderCollections(isPanno) {
  const searchVal = state.collectionSearch || "";
  const items = state.collections.filter(c => {
    if (c.is_panno !== isPanno) return false;
    if (!searchVal) return true;
    const q = searchVal.toLowerCase();
    return (c.name || "").toLowerCase().includes(q) ||
           (c.article || "").toLowerCase().includes(q) ||
           (c.size || "").toLowerCase().includes(q);
  });

  return `
    <div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <div id="collections-count" style="color:#777;font-size:13px;">${items.length} позицій</div>
        <button class="btn-gold" onclick="openAddModal(${isPanno})">+ Додати</button>
      </div>
      <div style="margin-bottom:12px;position:relative;">
        <input type="text" id="collection-search-input"
          oninput="handleSearchInput(this.value)"
          placeholder="🔍 Пошук за назвою, артикулом, розміром..."

          style="position:absolute;right:10px;top:50%;transform:translateY(-50%);cursor:pointer;color:#555;font-size:18px;">×</span>` : ''}
      </div>
      <div id="collections-list-container">
        ${items.length === 0 ? '<div style="text-align:center;padding:40px;color:#333;">' + (searchVal ? 'Нічого не знайдено' : 'Немає позицій') + '</div>' : ''}
        ${items.map(item => renderCollectionRow(item)).join('')}
      </div>
    </div>`;
}

function renderCollectionRow(item) {
  const photos = item.photos || [];
  const thumb = photos[0]?.url || "";
  const price = item.price_uah || 0;

  // Акційна ціна: явна sale_price АБО розрахунок зі знижки sale_percent
  let salePrice = 0;
  if (item.sale_price > 0) salePrice = item.sale_price;
  else if (item.sale_percent > 0 && price > 0) salePrice = Math.round(price * (1 - item.sale_percent / 100));
  const hasSale = salePrice > 0 && salePrice < price;
  const percent = item.sale_percent > 0 ? item.sale_percent : (hasSale ? Math.round((1 - salePrice / price) * 100) : 0);

  // Блок ціни
  let priceHtml;
  if (hasSale) {
    priceHtml = `
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:2px;">
        <span style="color:#777;font-size:11px;text-decoration:line-through;">${price.toLocaleString()} грн</span>
        <span style="color:#f44336;font-size:13px;font-weight:800;">${salePrice.toLocaleString()} грн</span>
        ${percent > 0 ? `<span style="background:#f4433622;color:#f44336;font-size:10px;font-weight:700;padding:1px 7px;border-radius:10px;border:1px solid #f4433644;">🔥 -${percent}%</span>` : ''}
      </div>`;
  } else {
    priceHtml = `<div style="color:#c9a84c;font-size:12px;font-weight:700;margin-top:2px;">${price ? price.toLocaleString() + " грн" : "—"}</div>`;
  }

  // Теги під ціною
  const tags = item.tags || [];
  const tagsHtml = tags.length > 0 ? `
    <div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;">
      ${tags.map(tag => `<span style="background:#c9a84c1a;color:#c9a84c;font-size:10px;font-weight:600;padding:2px 8px;border-radius:10px;border:1px solid #c9a84c33;">${tag}</span>`).join('')}
    </div>` : '';

  return `
    <div class="collection-row">
      ${thumb ? `<img class="collection-thumb" src="${thumb}" onerror="this.style.display='none'">` : `<div class="collection-thumb" style="display:flex;align-items:center;justify-content:center;color:#333;font-size:20px;">📷</div>`}
      <div style="flex:1;min-width:0;">
        <div style="font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${item.name}</div>
        <div style="color:#555;font-size:11px;margin-top:2px;">${item.size || "—"} · ${item.article || ""}</div>
        ${priceHtml}
        ${tagsHtml}
      </div>
      <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end;">
        <label class="switch" title="${item.is_visible ? 'Видимий' : 'Прихований'}">
          <input type="checkbox" ${item.is_visible ? 'checked' : ''} onchange="toggleVisible(${item.id}, this.checked)">
          <span class="slider"></span>
        </label>
        <button class="btn-dark" style="padding:6px 10px;font-size:11px;" onclick="openEditModal(${item.id})">✏️</button>
        <button class="btn-red" style="padding:6px 10px;font-size:11px;" onclick="deleteItem(${item.id})">🗑</button>
      </div>
    </div>`;
}

        </div>

async function loadBanners() {
  try {
    const banners = await api("GET", "banners?select=*&order=sort_order");
    state.banners = banners || [];
    const settings = await api("GET", "settings?select=*&key=eq.banner_autoplay");
    if (settings && settings[0]) state.bannerAutoplay = parseInt(settings[0].value) || 4;
  } catch(e) {
    console.error("Banner load error:", e);
    showToast("Помилка завантаження банерів: " + e.message, "error");
  }
}

const uploadBannerPhoto = async (file) => {
  const ext = file.name.split(".").pop();
  const path = `banners/${Date.now()}_${Math.random().toString(36).substr(2,5)}.${ext}`;
  const res = await fetch(`${SUPABASE_URL}/storage/v1/object/Photos/${path}`, {
    method: "POST",
    headers: { "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY, "Content-Type": file.type },
    body: file
  });
  if (!res.ok) { const err = await res.text(); throw new Error('Upload: ' + err); }
  return `${SUPABASE_URL}/storage/v1/object/public/Photos/${path}`;
};

async function handleBannerUpload(input) {
  const files = Array.from(input.files);
  if (!files.length) return;
  showToast("Завантаження " + files.length + " фото...", "info");
  try {
    let order = (state.banners || []).length;
    for (const file of files) {
      const url = await uploadBannerPhoto(file);
      const created = await api("POST", "banners", {
        image_url: url, title: "", subtitle: "", sort_order: order++, is_visible: true
      });
      if (created && created[0]) state.banners.push(created[0]);
    }
    showToast("✅ Додано " + files.length + " фото", "success");
    render();
  } catch(e) {
    showToast("Помилка: " + e.message, "error");
  }
}

async function updateBannerField(id, field, value) {
  try {
    await api("PATCH", "banners?id=eq." + id, { [field]: value });
    const b = state.banners.find(x => x.id === id);
    if (b) b[field] = value;
  } catch(e) { showToast("Помилка збереження: " + e.message, "error"); }
}

async function toggleBannerVisible(id) {
  const b = state.banners.find(x => x.id === id);
  if (!b) return;
  const newVal = b.is_visible === false ? true : false;
  try {
    await api("PATCH", "banners?id=eq." + id, { is_visible: newVal });
    b.is_visible = newVal;
    render();
  } catch(e) { showToast("Помилка: " + e.message, "error"); }
}

async function deleteBanner(id) {
  if (!confirm("Видалити це фото з банера?")) return;
  try {
    await api("DELETE", "banners?id=eq." + id);
    state.banners = state.banners.filter(x => x.id !== id);
    showToast("Фото видалено", "success");
    render();
  } catch(e) { showToast("Помилка: " + e.message, "error"); }
}

async function saveBannerSettings() {
  try {
    await api("POST", "settings?on_conflict=key", { key: "banner_autoplay", value: String(state.bannerAutoplay) });
    showToast("✅ Затримку збережено: " + state.bannerAutoplay + " сек", "success");
  } catch(e) {
    // fallback: try PATCH if row exists
    try {
      await api("PATCH", "settings?key=eq.banner_autoplay", { value: String(state.bannerAutoplay) });
      showToast("✅ Затримку збережено", "success");
    } catch(e2) { showToast("Помилка: " + e2.message, "error"); }
  }
}

let bannerDragSrc = null;
function bannerDragStart(e, id) { bannerDragSrc = id; e.dataTransfer.effectAllowed = "move"; }
async function bannerDrop(e, targetId) {
  e.preventDefault();
  if (bannerDragSrc === null || bannerDragSrc === targetId) return;
  const arr = state.banners.slice().sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));
  const from = arr.findIndex(x => x.id === bannerDragSrc);
  const to = arr.findIndex(x => x.id === targetId);
  const [moved] = arr.splice(from, 1);
  arr.splice(to, 0, moved);
  arr.forEach((b, i) => b.sort_order = i);
  state.banners = arr;
  render();
  try {
    for (const b of arr) await api("PATCH", "banners?id=eq." + b.id, { sort_order: b.sort_order });
  } catch(e) { showToast("Помилка порядку: " + e.message, "error"); }
  bannerDragSrc = null;
}

// Голосовий пошук
function rebuildWarehouseSingleTable() {
  var container = document.getElementById("warehouse-single-table");
  if (!container || !reportData.length) return;
  var whCols = reportHeaders.filter(function(h) { return h.indexOf("Склад") === 0 && HIDDEN_WAREHOUSES.indexOf(h) === -1; });
  var selectedWh = state.reportWarehouse || (whCols.length > 0 ? whCols[0] : "");
  var sortDir = state.reportSortDir || "desc";
  var search = (state.reportSearch || "").toLowerCase();
  var rows2 = reportData.filter(function(r) {
    return !search || String(r["Артикул"]||"").toLowerCase().includes(search) || String(r["Назва"]||"").toLowerCase().includes(search);
  });
  rows2.sort(function(a, b) {
    var va = parseFloat(a[selectedWh]) || 0, vb = parseFloat(b[selectedWh]) || 0;
    return sortDir === "asc" ? va - vb : vb - va;
  });
  var html2 = '<table style="width:100%;border-collapse:collapse;font-size:13px;">';
  html2 += '<thead><tr style="background:#1a1a1a;">';
  html2 += '<th style="padding:10px 12px;text-align:left;color:#777;font-weight:600;border-bottom:1px solid #2a2a2a;">Артикул</th>';
  html2 += '<th style="padding:10px 12px;text-align:left;color:#777;font-weight:600;border-bottom:1px solid #2a2a2a;">Назва</th>';
  html2 += '<th style="padding:10px 12px;text-align:left;color:#777;font-weight:600;border-bottom:1px solid #2a2a2a;">Од.</th>';
  html2 += '<th style="padding:10px 12px;text-align:right;color:#e57373;font-weight:700;border-bottom:1px solid #2a2a2a;">Резерв</th>';
  html2 += '<th style="padding:10px 12px;text-align:right;color:#c9a84c;font-weight:700;border-bottom:1px solid #2a2a2a;cursor:pointer;" onclick="state.reportSortDir=state.reportSortDir===\'asc\'?\'desc\':\'asc\';rebuildWarehouseSingleTable();">Залишок ' + (sortDir==="asc"?"↑":"↓") + '</th>';
  html2 += '</tr></thead><tbody>';
  rows2.forEach(function(row, i) {
    var val = parseFloat(row[selectedWh]) || 0;
    var color = val === 0 ? "#f4433644" : val < 5 ? "#ff980022" : "#4caf5022";
    var textColor = val === 0 ? "#f44336" : val < 5 ? "#ff9800" : "#4caf50";
    var reserve = parseFloat(row["Резерв"]) || 0;
    html2 += '<tr style="background:' + (i%2===0?"#0d0d0d":"#0a0a0a") + ';border-bottom:1px solid #141414;">';
    html2 += '<td style="padding:10px 12px;color:#555;font-size:11px;">' + String(row["Артикул"]||"") + '</td>';
    html2 += '<td style="padding:10px 12px;color:#ddd;">' + String(row["Назва"]||"") + '</td>';
    html2 += '<td style="padding:10px 12px;color:#666;font-size:11px;">' + String(row["Од. вим."]||"м²") + '</td>';
    html2 += '<td style="padding:10px 12px;text-align:right;">' + (reserve > 0 ? '<span style="background:#f4433622;color:#e57373;padding:3px 10px;border-radius:8px;font-weight:700;">' + reserve.toFixed(2) + '</span>' : '<span style="color:#333;">—</span>') + '</td>';
    html2 += '<td style="padding:10px 12px;text-align:right;"><span style="background:' + color + ';color:' + textColor + ';padding:3px 10px;border-radius:8px;font-weight:700;">' + val.toFixed(2) + '</span></td>';

function transferToggle(article, checked, maxVal) {
  if (!state.transferItems) state.transferItems = {};
  if (!state.transferItems[article]) {
    state.transferItems[article] = { checked: false, qty: 44.64, pallets: 1, qtyManual: false, photoFile: null, photoName: null };
  }
  state.transferItems[article].checked = checked;
  if (checked && !state.transferItems[article].qtyManual) {
    state.transferItems[article].qty = Math.round((state.transferItems[article].pallets || 1) * 44.64 * 100) / 100;
  }
  rebuildTransferTable();
  updateTransferSendBtn();
}

function transferPallets(article, n) {
  if (!state.transferItems) state.transferItems = {};
  if (!state.transferItems[article]) state.transferItems[article] = { checked: true, qty: 0, pallets: 1 };
  state.transferItems[article].pallets = n;
  rebuildTransferTable();
}

function transferPhoto(article, input) {
  if (!input.files || !input.files[0]) return;
  var file = input.files[0];
  if (!state.transferItems) state.transferItems = {};
  if (!state.transferItems[article]) state.transferItems[article] = { checked: true };
  // Зберігаємо файл і ім'я
  state.transferItems[article].photoFile = file;
  state.transferItems[article].photoName = file.name;
  rebuildTransferTable();
  showToast("📷 Фото додано: " + file.name, "success");
}

function transferRemovePhoto(article) {
  if (!state.transferItems || !state.transferItems[article]) return;
  state.transferItems[article].photoFile = null;
  state.transferItems[article].photoName = null;
  rebuildTransferTable();
}

async function sendTransferTelegram() {
  var fromWh = state.reportWarehouse || "";
  var toWh = state.transferTo || "";
  if (!fromWh || !toWh) { showToast("Оберіть склади", "error"); return; }
  var items = Object.keys(state.transferItems || {}).filter(function(k) {
    return state.transferItems[k] && state.transferItems[k].checked && state.transferItems[k].qty > 0;
  });
  if (items.length === 0) { showToast("Оберіть товари", "error"); return; }

  showToast("⏳ Надсилаємо...", "success");

  var now = new Date().toLocaleString("uk", { day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit" });
  var lines = items.map(function(article) {
    var row = reportData.find(function(r) { return String(r["Артикул"]||"").trim() === article; }) || {};
    var item = state.transferItems[article];
    var qty = item.qty || 0;
    var pallets = item.pallets || 1;
    var unit = String(row["Од. вим."]||"м²");
    var photoMark = item.photoFile ? " 📷" : "";
    return "• " + String(row["Назва"]||article) + photoMark + "\n  " + article + "\n  Палет: " + pallets + " · " + qty.toFixed(2) + " " + unit;
  });

  var msg = "🔄 ПЕРЕМІЩЕННЯ ТОВАРІВ\n\n"
    + "📤 З: " + fromWh + "\n"
    + "📥 На: " + toWh + "\n"
    + "🕐 " + now + "\n"
    + "📦 Позицій: " + items.length + "\n\n"
    + lines.join("\n\n");

  const TG_URL = "https://svbmamaqrtsknuztxiuq.supabase.co/functions/v1/telegram-proxy";
  const TG_HEADERS = {
    "Content-Type": "application/json",
    "apikey": SUPABASE_KEY,
    "Authorization": "Bearer " + SUPABASE_KEY
  };

  try {
    // Надсилаємо текст
    await fetch(TG_URL, {
      method: "POST",
      headers: TG_HEADERS,
      body: JSON.stringify({ action: "sendMessage", text: msg })
    });

    // Надсилаємо фото для кожного товару
    for (var i = 0; i < items.length; i++) {
      var article = items[i];
      var item = state.transferItems[article];
      if (!item.photoFile) continue;
      var row = reportData.find(function(r) { return String(r["Артикул"]||"").trim() === article; }) || {};
      var name = String(row["Назва"]||article);
      var caption = "📷 " + name + " [" + article + "]\nПалет: " + (item.pallets||1) + " · " + (item.qty||0).toFixed(2) + " " + String(row["Од. вим."]||"м²");

      // Конвертуємо фото в base64
      await new Promise(function(resolve, reject) {
        var reader = new FileReader();
        reader.onload = async function(e) {
          var base64 = e.target.result.split(',')[1];
          try {
            await fetch(TG_URL, {
              method: "POST",
              headers: TG_HEADERS,
              body: JSON.stringify({ action: "sendPhoto", photo: base64, caption: caption })
            });
          } catch(err) { console.log("Помилка фото:", err); }
          resolve();
        };
        reader.onerror = resolve;
        reader.readAsDataURL(item.photoFile);
      });
    }

    showToast("✅ Накладну надіслано в Telegram!", "success");
    state.transferItems = {};
    state.transferTo = "";
    render();
    setTimeout(rebuildTransferTable, 10);
  } catch(e) {
    showToast("❌ Помилка: " + e.message, "error");
  }
}

function transferCheckAll(checked) {
  var fromWh = state.reportWarehouse || "";

function startVoiceSearch(onResult) {
  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
    showToast("Голосовий пошук не підтримується в цьому браузері", "error");
    return;
  }
  var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  var recognition = new SpeechRecognition();
  recognition.lang = "uk-UA";
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;
  recognition.onresult = function(e) {
    var text = e.results[0][0].transcript;
    onResult(text);
  };
  recognition.onerror = function(e) {
    var msgs = {
      "not-allowed": "Мікрофон заблоковано. Дозвольте доступ в браузері.",
      "no-speech": "Не почуто мови. Спробуйте ще раз.",
      "network": "Помилка мережі. Потрібен інтернет.",
      "aborted": "Скасовано.",
    };
    showToast(msgs[e.error] || "Помилка: " + e.error, "error");
  };
  recognition.start();
  showToast("🎤 Говоріть...", "success");
}

function buildReportTableHtml(rows) {
  if (!rows || rows.length === 0) return '<div style="text-align:center;padding:40px;color:#555;">Нічого не знайдено</div>';

  var search = (state.reportSearch||"").toLowerCase();
  var selectedWh = state.reportWarehouse || "";

  var filtered = rows.filter(function(r) {
    var matchSearch = !search ||
      String(r["Артикул"]||"").toLowerCase().includes(search) ||
      String(r["Назва"]||"").toLowerCase().includes(search);
    var whVal = selectedWh ? (parseFloat(r[selectedWh]) || 0) : 1;
    var matchWh = !selectedWh || whVal > 0;
    return matchSearch && matchWh;
  });

  // Сортуємо по залишках вибраного складу або по загальній сумі
  filtered.sort(function(a, b) {
    var valA = selectedWh ? (parseFloat(a[selectedWh]) || 0) : (parseFloat(a["Всього"]) || 0);
    var valB = selectedWh ? (parseFloat(b[selectedWh]) || 0) : (parseFloat(b["Всього"]) || 0);
    return valB - valA;
  });

  var whCols = reportHeaders.filter(function(h) {
    return h.indexOf("Склад") === 0 && HIDDEN_WAREHOUSES.indexOf(h) === -1;
  });

  var html = '<div style="display:flex;flex-direction:column;gap:8px;">';

  filtered.forEach(function(row) {
    var article = String(row["Артикул"]||"");
    var name = String(row["Назва"]||"");
    var unit = String(row["Од. вим."]||"м²");
    var total = parseFloat(row["Всього"]) || 0;

    // Беремо лише склади з ненульовими залишками і сортуємо по спаданню
    var whItems = whCols.map(function(wh, i) {
      return { name: wh.replace("Склад ",""), val: parseFloat(row[wh]) || 0, color: WH_COLORS[i % WH_COLORS.length] };
    }).filter(function(w) { return w.val > 0; })
      .sort(function(a, b) { return b.val - a.val; });

    if (whItems.length === 0 && total === 0) return;

    html += '<div style="background:#111;border-radius:12px;padding:12px 14px;border:1px solid #1e1e1e;">';

    // Заголовок
    html += '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;">';
    html += '<div style="min-width:0;flex:1;">';
    html += '<div style="color:#c9a84c;font-size:10px;letter-spacing:1px;margin-bottom:2px;">' + article + '</div>';
    html += '<div style="color:#fff;font-size:12px;word-break:break-word;">' + name + '</div>';
    html += '</div>';
    html += '<div style="text-align:right;flex-shrink:0;margin-left:12px;">';
    html += '<div style="color:#c9a84c;font-size:15px;font-weight:700;">' + total.toFixed(2) + '</div>';
    html += '<div style="color:#555;font-size:10px;">' + unit + ' всього</div>';
    html += '</div>';
    html += '</div>';

    if (whItems.length > 0) {
      // Прогрес бар
      html += '<div style="display:flex;height:8px;border-radius:4px;overflow:hidden;background:#1a1a1a;margin-bottom:6px;">';
      whItems.forEach(function(w) {
        var pct = total > 0 ? (w.val / total * 100).toFixed(1) : 0;
        html += '<div style="width:' + pct + '%;background:' + w.color + ';transition:width 0.3s;" title="' + w.name + ': ' + w.val.toFixed(2) + '"></div>';
      });
      html += '</div>';

      // Легенда
      html += '<div style="display:flex;flex-wrap:wrap;gap:6px;">';
      whItems.forEach(function(w) {
        html += '<span style="font-size:11px;color:' + w.color + ';">■ ' + w.name + ' ' + w.val.toFixed(2) + '</span>';
      });
      html += '</div>';
    }

    html += '</div>';
  });

  html += '</div>';
  return html;
}

let reportData = [];
let reportHeaders = [];

async function loadWarehouseReport() {
  state.reportLoading = true;
  state.reportError = null;
  reportData = [];
  render();
  try {
    const res = await fetch("https://script.google.com/macros/s/AKfycbymfDIx4fu4j_nROvQ5PTgPPz6QPRUNzu1iu8WSGQed74XUDIZA2OAc0i7x0Rb-X-Ed/exec");
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    reportHeaders = data.headers || [];
    reportData = data.rows || [];

    // Додаємо резерв з Supabase
    try {
      const resSupabase = await api("GET", "collections?select=article,reserve&is_visible=not.is.null");
      if (Array.isArray(resSupabase)) {
        const reserveMap = {};
        resSupabase.forEach(function(item) {
          if (item.article) reserveMap[item.article.trim()] = item.reserve || 0;
        });
        reportData = reportData.map(function(row) {
          var article = String(row["Артикул"] || "").trim();
          row["Резерв"] = reserveMap[article] || 0;
          return row;
        });
      }
    } catch(e2) { console.log("Резерв не завантажено:", e2.message); }

    state.reportLoading = false;
    render();
    setTimeout(function() {
      rebuildWarehouseSingleTable();
      rebuildTransferTable();
    }, 50);
  } catch(e) {
    state.reportLoading = false;
    state.reportError = e.message;
    render();
  }
}



function renderReportTable(rows) {
  var container = document.getElementById("report-container");
  if (!container) return;
  if (!rows || rows.length === 0) {
    container.innerHTML = '<div style="text-align:center;padding:40px;color:#555;">Нічого не знайдено</div>';
    return;
  }

  var table = document.createElement("div");
  table.style.overflowX = "auto";

  var t = document.createElement("table");
  t.style.cssText = "width:100%;border-collapse:collapse;font-size:12px;min-width:900px;";

  // Header
  var thead = document.createElement("thead");
  var htr = document.createElement("tr");
  htr.style.background = "#0a0a0a";
  reportHeaders.forEach(function(h) {
    var th = document.createElement("th");
    var isWh = h.indexOf("Склад") === 0;
    var shortName = isWh ? h.replace("Склад ", "") : h;
    th.textContent = shortName;
    th.style.cssText = "padding:8px 10px;text-align:" + (isWh || h==="Всього" ? "right" : "left") + ";border-bottom:2px solid #2a2a2a;white-space:nowrap;font-size:11px;color:" + (h==="Всього" ? "#c9a84c" : isWh ? "#7b68ee" : "#777") + ";";
    htr.appendChild(th);
  });
  thead.appendChild(htr);
  t.appendChild(thead);

  // Body
  var tbody = document.createElement("tbody");
  rows.forEach(function(row, ri) {
    var tr = document.createElement("tr");
    tr.style.background = ri % 2 === 0 ? "#111" : "#0f0f0f";
    reportHeaders.forEach(function(h) {
      var td = document.createElement("td");
      var val = row[h];
      var isWh = h.indexOf("Склад") === 0;
      var isTotal = h === "Всього";
      var numVal = parseFloat(val) || 0;
      var color, display, align = "left";
      if (h === "Артикул") { color = "#c9a84c"; display = String(val); }
      else if (h === "Назва") { color = "#fff"; display = String(val); }
      else if (h === "Од. вим.") { color = "#555"; display = String(val); }
      else if (isTotal) { color = "#c9a84c"; display = numVal > 0 ? numVal.toFixed(2) : "—"; align = "right"; }
      else if (isWh) { color = numVal > 0 ? "#4caf50" : "#333"; display = numVal > 0 ? numVal.toFixed(2) : "—"; align = "right"; }
      else { color = "#777"; display = String(val); }
      td.textContent = display;
      td.style.cssText = "padding:7px 10px;border-bottom:1px solid #1a1a1a;color:" + color + ";white-space:nowrap;text-align:" + align + ";";
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  t.appendChild(tbody);
  table.appendChild(t);
  container.innerHTML = "";
  container.appendChild(table);
}

function calcSalePercent(priceVal) {
  const price = parseFloat(priceVal);
  const uah = parseFloat(document.getElementById("f-price-uah")?.value || "0");
  if (!isNaN(price) && price > 0 && uah > 0) {
    const percent = Math.round((1 - price / uah) * 100);
    const percentEl = document.getElementById("f-sale-percent");
    if (percentEl) percentEl.value = percent > 0 ? percent : "";
  }
  updateSalePreview();
}

function calcSalePrice(percentVal) {
  const percent = parseFloat(percentVal);
  const uah = parseFloat(document.getElementById("f-price-uah")?.value || "0");
  if (!isNaN(percent) && percent > 0 && uah > 0) {
    const salePrice = Math.round(uah * (1 - percent / 100));
    const priceEl = document.getElementById("f-sale-price");
    if (priceEl) priceEl.value = salePrice;
  }
  updateSalePreview();
}

function updateSalePreview() {
  const preview = document.getElementById("sale-preview");
  if (!preview) return;
  const salePrice = parseFloat(document.getElementById("f-sale-price")?.value || "0");
  const uah = parseFloat(document.getElementById("f-price-uah")?.value || "0");
  const until = document.getElementById("f-sale-until")?.value;
  if (salePrice > 0 && uah > 0) {
    const savings = Math.round(uah - salePrice);
    const percent = Math.round((1 - salePrice / uah) * 100);
    preview.innerHTML = "🔥 " + salePrice.toLocaleString() + " грн " +
      "(було " + uah.toLocaleString() + " грн, економія " + savings.toLocaleString() + " грн · -" + percent + "%)" +
      (until ? "<br>⏰ до " + new Date(until).toLocaleDateString("uk-UA") : "");
    preview.style.display = "block";
  } else {
    preview.style.display = "none";
  }
}

let tabDragSrc = null;

function tabDragStart(e, tab) {
  tabDragSrc = tab;
  e.target.style.opacity = "0.4";
  e.dataTransfer.effectAllowed = "move";
}

function tabDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = "move";
}

function tabDrop(e, targetTab) {
  e.preventDefault();
  if (!tabDragSrc || tabDragSrc === targetTab) return;
  reorderTab(tabDragSrc, targetTab);
  tabDragSrc = null;
}

function tabDragEnd(e) {
  tabDragSrc = null;
  document.querySelectorAll(".nav-tab").forEach(function(el) { el.style.opacity = "1"; });
}

function moveTab(tab, dir) {
  var order = state.tabOrder.slice();
  var idx = order.indexOf(tab);
  var newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= order.length) return;
  order.splice(idx, 1);
  order.splice(newIdx, 0, tab);
  state.tabOrder = order;
  localStorage.setItem("msklad_tab_order", JSON.stringify(order));
  render();
}

function reorderTab(fromTab, toTab) {
  var order = state.tabOrder.slice();
  var fromIdx = order.indexOf(fromTab);
  var toIdx = order.indexOf(toTab);
  if (fromIdx === -1 || toIdx === -1 || fromIdx === toIdx) return;
  order.splice(fromIdx, 1);
  order.splice(toIdx, 0, fromTab);
  state.tabOrder = order;
  localStorage.setItem("msklad_tab_order", JSON.stringify(order));
  render();
}

// Long press + swipe для мобільного
var longPressTimer = null;
var longPressSrc = null;
var longPressTouchId = null;

function tabLongPressStart(e, tab) {
  var touch = e.touches[0];
  longPressTouchId = touch.identifier;
  if (navigator.vibrate) navigator.vibrate(50);
  longPressTimer = setTimeout(function() {
    longPressSrc = tab;
    document.querySelectorAll(".nav-tab").forEach(function(t) {
      t.style.outline = t.getAttribute("data-tab") === tab ? "2px solid #c9a84c" : "";
    });
    // Додаємо обробник touchmove на весь документ
    document.addEventListener("touchmove", onTabDragMove, { passive: false });
    document.addEventListener("touchend", onTabDragEnd);
  }, 500);
}

function tabLongPressEnd(e, tab) {
  if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
  if (!longPressSrc) switchTab(tab);
}

function onTabDragMove(e) {
  var touch = e.touches[0];
  var el = document.elementFromPoint(touch.clientX, touch.clientY);
  document.querySelectorAll(".nav-tab").forEach(function(t) {
    var isActive = t.getAttribute("data-tab") === longPressSrc;
    var isTarget = el && t === el && !isActive;
    t.style.outline = isActive ? "2px solid #c9a84c" : "";
    t.style.background = isTarget ? "#c9a84c33" : "";
  });
}

function onTabDragEnd(e) {
  document.removeEventListener("touchmove", onTabDragMove);
  document.removeEventListener("touchend", onTabDragEnd);
  var touch = e.changedTouches[0];
  var el = document.elementFromPoint(touch.clientX, touch.clientY);
  document.querySelectorAll(".nav-tab").forEach(function(t) {
    t.style.outline = "";
    t.style.background = "";
  });
  if (el && el.classList.contains("nav-tab")) {
    var targetTab = el.getAttribute("data-tab");
    if (targetTab && targetTab !== longPressSrc) {
      reorderTab(longPressSrc, targetTab);
    }
  }
  longPressSrc = null;
}

function handleTabClick(e, tab) {
  if (!longPressSrc) switchTab(tab);
}

async function loadData() {
  state.loading = true;
  try {
    const [collections, photos, settings] = await Promise.all([
      api("GET", "collections?select=*&order=sort_order,created_at"),
      api("GET", "collection_photos?select=*&order=sort_order"),
      api("GET", "settings?select=*")
    ]);
    
    // Attach photos to collections
    state.collections = (collections || []).map(c => ({
      ...c,
      photos: (photos || []).filter(p => p.collection_id === c.id)
    }));

    // Load rates
    const eurSetting = (settings || []).find(s => s.key === "eur_rate");
    const usdSetting = (settings || []).find(s => s.key === "usd_rate");
    const autoSetting = (settings || []).find(s => s.key === "auto_rate");
    
    state.autoRate = autoSetting?.value === "true";
    if (state.autoRate) {
      const rates = await getNBURate();
      state.rates = rates;
    } else {
      state.rates = {
        eur: parseFloat(eurSetting?.value || "43.5"),
        usd: parseFloat(usdSetting?.value || "41.2")
      };
    }
  } catch(e) {
    console.error(e);
    showToast('Помилка: ' + e.message, 'error');
  }
  state.loading = false;
  await loadBanners();
  render();
}

      ${tag}
      <span data-remove="${tag}" style="cursor:pointer;font-size:16px;line-height:1;padding:0 2px;">×</span>
    </span>`
  ).join('');

  // Оновлюємо існуючі теги
  const existingContainer = document.getElementById("existing-tags-container");
  if (existingContainer) {
    const existing = getExistingTags(state.editItem.tags || []);
    existingContainer.innerHTML = existing.map(tag =>
      `<span data-add="${tag}" style="cursor:pointer;padding:4px 10px;border-radius:20px;background:#1a1a1a;border:1px solid #2a2a2a;color:#555;font-size:12px;font-weight:700;">+ ${tag}</span>`
    ).join('');
  }
}

function recalcPrices(source, val) {
  const v = parseFloat(val);
  if (isNaN(v) || v < 0) return;
  const eur_rate = state.rates.eur || 43.5;
  const usd_rate = state.rates.usd || 41.2;

  let uah = 0;
  if (source === "uah") uah = v;
  else if (source === "eur") uah = v * eur_rate;
  else if (source === "usd") uah = v * usd_rate;

  const eur = Math.round((uah / eur_rate) * 100) / 100;
  const usd = Math.round((uah / usd_rate) * 100) / 100;
  const uahR = Math.round(uah);

  const uahEl = document.getElementById("f-price-uah");
  const eurEl = document.getElementById("f-price-eur");
  const usdEl = document.getElementById("f-price-usd");

  if (source !== "uah" && uahEl) uahEl.value = uahR;
  if (source !== "eur" && eurEl) eurEl.value = eur;
  if (source !== "usd" && usdEl) usdEl.value = usd;
}

function calcFromEur(val) { recalcPrices("eur", val); }
function calcFromUsd(val) { recalcPrices("usd", val); }
function calcFromUah(val) { recalcPrices("uah", val); }

async function saveItem() {
  const btn = document.getElementById("save-btn");
  btn.disabled = true;
  btn.textContent = "Збереження...";

  try {
    const item = state.editItem;
    const data = {
      name: document.getElementById("f-name").value.trim(),
      article: document.getElementById("f-article").value.trim(),
      size: document.getElementById("f-size").value.trim(),
      price_uah: Math.max(0, parseFloat(document.getElementById("f-price-uah").value) || 0),
      price_eur: Math.max(0, parseFloat(document.getElementById("f-price-eur").value) || 0),
      price_usd: Math.max(0, parseFloat(document.getElementById("f-price-usd").value) || 0),
      price_wholesale: Math.max(0, parseFloat(document.getElementById("f-price-wholesale").value) || 0),
      description: document.getElementById("f-desc").value.trim(),
      tags: item.tags || [],
      is_visible: document.getElementById("f-visible").checked,
      is_panno: item.is_panno || false,
      finish_tags: item.finish_tags || [],
      bundle_articles: item.bundle_articles || [],
      reviews: state.editItem.reviews || [],
      sale_price: Math.max(0, parseFloat(document.getElementById("f-sale-price")?.value || "0") || 0),
      sale_percent: Math.max(0, parseInt(document.getElementById("f-sale-percent")?.value || "0") || 0),
      sale_until: document.getElementById("f-sale-until")?.value || null,
      updated_at: new Date().toISOString()
    };

    if (!data.name) { showToast('Введіть назву!', 'error'); btn.disabled = false; btn.textContent = "Зберегти"; return; }

    let collectionId = item.id;

    if (item.id) {
      await api("PATCH", `collections?id=eq.${item.id}`, data);
    } else {
      const result = await api("POST", "collections", data);
      if (!result || result.length === 0) throw new Error("Товар не створено — перевірте RLS політики в Supabase (collections: insert)");
      collectionId = result[0].id;
    }

    // Видаляємо фото які були прибрані
    const allPhotos = item.photos || [];
    const existingPhotos = allPhotos.filter(p => !p.isNew && p.url);
    const existingUrls = existingPhotos.map(p => p.url);
    
    // Отримуємо всі фото з бази
    const dbPhotos = await api("GET", `collection_photos?collection_id=eq.${collectionId}&select=id,url`);
    if (dbPhotos && dbPhotos.length > 0) {
      for (const dbPhoto of dbPhotos) {
        if (!existingUrls.includes(dbPhoto.url)) {
          await api("DELETE", `collection_photos?id=eq.${dbPhoto.id}`);
        }
      }
    }

    // Оновлюємо sort_order для існуючих фото (з урахуванням нового порядку)
    for (let i = 0; i < allPhotos.length; i++) {
      const photo = allPhotos[i];
      if (!photo.isNew && photo.url && dbPhotos) {
        const dbPhoto = dbPhotos.find(p => p.url === photo.url);
        if (dbPhoto) {
          await api("PATCH", `collection_photos?id=eq.${dbPhoto.id}`, { sort_order: i });
        }
      }
    }

    // Upload new photos
    const newPhotos = allPhotos.filter(p => p.isNew && p.file);
    for (let i = 0; i < newPhotos.length; i++) {
      const photo = newPhotos[i];
      const url = await uploadPhoto(photo.file, collectionId);
      const globalIndex = allPhotos.indexOf(photo);
      await api("POST", "collection_photos", {
        collection_id: parseInt(collectionId),
        url,
        sort_order: globalIndex
      });
    }

    await loadData();
    closeModal();
  } catch(e) {
    showToast('Помилка: ' + e.message, 'error');
    btn.disabled = false;
    btn.textContent = "Зберегти";
  }
}

async function deleteItem(id) {
  if (!window._confirmDelete) { showToast('Натисни ще раз щоб видалити', 'error'); window._confirmDelete = setTimeout(() => window._confirmDelete = null, 3000); return; } clearTimeout(window._confirmDelete); window._confirmDelete = null;
  try {
    await api("DELETE", `collections?id=eq.${id}`);
    await loadData();
  } catch(e) {
    showToast('Помилка: ' + e.message, 'error');
  }
}

async function toggleVisible(id, visible) {
  try {
    await api("PATCH", `collections?id=eq.${id}`, { is_visible: visible, updated_at: new Date().toISOString() });
    const item = state.collections.find(c => c.id === id);
    if (item) item.is_visible = visible;
  } catch(e) {
    showToast('Помилка: ' + e.message, 'error');
  }
}

async function toggleAutoRate(auto) {
  state.autoRate = auto;
  await api("PATCH", "settings?key=eq.auto_rate", { value: auto.toString(), updated_at: new Date().toISOString() });
  if (auto) await refreshRates();
  else render();
}

async function refreshRates() {
  const rates = await getNBURate();
  state.rates = rates;
  await Promise.all([
    api("PATCH", "settings?key=eq.eur_rate", { value: rates.eur.toString() }),
    api("PATCH", "settings?key=eq.usd_rate", { value: rates.usd.toString() })
  ]);
  render();
}

async function saveRates() {
  const eur = parseFloat(document.getElementById("rate-eur").value);
  const usd = parseFloat(document.getElementById("rate-usd").value);
  state.rates = { eur, usd };
  await Promise.all([
    api("PATCH", "settings?key=eq.eur_rate", { value: eur.toString() }),
    api("PATCH", "settings?key=eq.usd_rate", { value: usd.toString() })
  ]);
  showToast('Курс збережено! ✅', 'success');
  render();
}

// Зберігаємо розпізнані дані тимчасово
var incomingParsed = { date: null, articles: [] };

async function handleIncomingFile(file) {
  if (!file) return;
  const preview = document.getElementById('incoming-preview');
  const img = document.getElementById('incoming-img');
  const status = document.getElementById('incoming-status');
  const result = document.getElementById('incoming-result');

  preview.style.display = 'block';
  result.style.display = 'none';
  status.style.display = 'block';
  status.textContent = '⟳ Розпізнаємо дані...';

  // Показуємо прев'ю
  const reader = new FileReader();
  reader.onload = async (e) => {
    img.src = e.target.result;
    const base64 = e.target.result.split(',')[1];
    const mimeType = file.type || 'image/jpeg';

    try {
      const response = await fetch(SUPA + '/functions/v1/claude-proxy', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + KEY },
        body: JSON.stringify({
          model: 'claude-sonnet-4-6',
          max_tokens: 1000,
          messages: [{
            role: 'user',
            content: [
              {
                type: 'image',
                source: { type: 'base64', media_type: mimeType, data: base64 }
              },
              {
                type: 'text',
                text: 'Це скрін документа "Замовлення постачальнику" з 1С. Витягни: 1) дату надходження (поле "Бажана дата надходження" або дата документа), 2) список товарів з артикулами. Відповідай ТІЛЬКИ JSON без зайвого тексту: {"date":"YYYY-MM-DD","items":[{"article":"артикул","name":"назва товару","qty":кількість}]}. Артикул — це код виду 00-00012345. Якщо артикул не видно — використай порядковий номер як "item_N".'
              }
            ]
          }]
        })
      });

      const data = await response.json();
      const text = data.content.map(i => i.text || '').join('');
      const clean = text.replace(/```json|```/g, '').trim();
      const parsed = JSON.parse(clean);

      incomingParsed = parsed;

      // Заповнюємо форму
      document.getElementById('incoming-date').value = parsed.date || '';

      const itemsList = document.getElementById('incoming-items-list');
      itemsList.innerHTML = parsed.items.map((item, i) => `
        <div style="display:flex;gap:8px;margin-bottom:6px;align-items:center;">
          <input value="${item.article}" onchange="incomingParsed.items[${i}].article=this.value"
            style="flex:0 0 140px;padding:6px 8px;border-radius:6px;border:1px solid #2a2a2a;background:#1a1a1a;color:#c9a84c;font-size:11px;">
          <span style="color:#555;font-size:11px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${item.name}">${item.name}</span>
          <span style="color:#444;font-size:11px;flex:0 0 60px;text-align:right;">${item.qty} м²</span>
        </div>
      `).join('');

      status.style.display = 'none';
      result.style.display = 'block';

    } catch(e) {
      status.textContent = '❌ Помилка розпізнавання: ' + e.message;
    }
  };
  reader.readAsDataURL(file);
}

async function saveIncomingData() {
  const date = document.getElementById('incoming-date').value;
  if (!date) { showToast('Вкажіть дату поступлення', 'error'); return; }
  if (!incomingParsed.items || incomingParsed.items.length === 0) { showToast('Немає товарів', 'error'); return; }

  const articles = incomingParsed.items.map(i => i.article).filter(a => a && !a.startsWith('item_'));
  if (articles.length === 0) { showToast('Артикули не розпізнано', 'error'); return; }

  try {
    // Оновлюємо expected_date по артикулу в таблиці collections
    let updated = 0;
    for (const article of articles) {
      const res = await fetch(SUPA + '/rest/v1/collections?article=eq.' + encodeURIComponent(article), {
        method: 'PATCH',
        headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY, 'Content-Type': 'application/json', 'Prefer': 'return=representation' },
        body: JSON.stringify({ expected_date: date })
      });
      const data = await res.json();
      if (Array.isArray(data) && data.length > 0) updated++;
    }

    showToast('Збережено: ' + updated + ' з ' + articles.length + ' товарів оновлено ✅', 'success');
    loadIncomingCurrent();
  } catch(e) {
    showToast('Помилка збереження: ' + e.message, 'error');
  }
}

async function loadIncomingCurrent() {
  const el = document.getElementById('incoming-current');
  if (!el) return;
  try {
    const res = await fetch(SUPA + '/rest/v1/collections?expected_date=not.is.null&select=article,name,expected_date&order=expected_date', {
      headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY }
    });
    const data = await res.json();
    if (!data.length) { el.innerHTML = '<span style="color:#444;">Немає очікуваних поступлень</span>'; return; }
    el.innerHTML = data.map(item => `
      <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #1a1a1a;">
        <div>
          <div style="color:#aaa;font-size:12px;">${item.name}</div>
          <div style="color:#555;font-size:11px;">${item.article}</div>
        </div>
        <div style="display:flex;gap:8px;align-items:center;">
          <span style="color:#c9a84c;font-size:12px;font-weight:700;">${item.expected_date}</span>
          <button onclick="clearExpectedDate('${item.article}')" style="background:transparent;border:1px solid #333;color:#555;cursor:pointer;font-size:10px;padding:3px 7px;border-radius:6px;">✕</button>
        </div>
      </div>
    `).join('');
  } catch(e) {
    el.innerHTML = '<span style="color:#f44;">Помилка завантаження</span>';
  }
}

async function clearExpectedDate(article) {
  await fetch(SUPA + '/rest/v1/collections?article=eq.' + encodeURIComponent(article), {
    method: 'PATCH',
    headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({ expected_date: null })
  });
  showToast('Очікування скасовано', 'success');
  loadIncomingCurrent();
}
