const api = async (method, path, body) => {
  const res = await fetch(SUPABASE_URL + "/rest/v1/" + path, {
    method,
    headers: {
      "apikey": SUPABASE_KEY,
      "Authorization": "Bearer " + SUPABASE_KEY,
      "Content-Type": "application/json",
      "Prefer": method === "POST" ? "return=representation" : ""
    },
    body: body ? JSON.stringify(body) : undefined
  });
  if (!res.ok) { const e = await res.text(); throw new Error(e); }
  return res.status === 204 ? null : res.json();
};

const uploadPhoto = async (file, collectionId) => {
  const ext = file.name.split(".").pop();
  const path = `collections/${collectionId}/${Date.now()}.${ext}`;
  const res = await fetch(`${SUPABASE_URL}/storage/v1/object/Photos/${path}`, {
    method: "POST",
    headers: {
      "apikey": SUPABASE_KEY,
      "Authorization": "Bearer " + SUPABASE_KEY,
      "Content-Type": file.type
    },
    body: file
  });
  if (!res.ok) { const err = await res.text(); throw new Error('Upload: ' + err); }
  return `${SUPABASE_URL}/storage/v1/object/public/Photos/${path}`;
};

const getNBURate = async () => {
  try {
    const res = await fetch("https://bank.gov.ua/NBUStatService/v1/statdirectory/exchange?json");
    const data = await res.json();
    const eur = data.find(x => x.cc === "EUR");
    const usd = data.find(x => x.cc === "USD");
    return { eur: eur?.rate || 43.5, usd: usd?.rate || 41.2 };
  } catch { return { eur: 43.5, usd: 41.2 }; }
};


function showToast(msg, type) {
  let t = document.getElementById("toast");
  if (!t) {
    t = document.createElement("div");
    t.id = "toast";
    t.className = "toast";
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.className = "toast " + (type || "");
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 3000);
}

let reportData = [];
let reportHeaders = [];

async function loadWarehouseReport() {
  const container = document.getElementById("report-container");
  if (!container) return;
  container.innerHTML = '<div style="text-align:center;padding:40px;color:#c9a84c;animation:pulse 1.5s infinite;">⟳ Завантаження...</div>';

  try {
    const res = await fetch("https://script.google.com/macros/s/AKfycbymfDIx4fu4j_nROvQ5PTgPPz6QPRUNzu1iu8WSGQed74XUDIZA2OAc0i7x0Rb-X-Ed/exec");
    const data = await res.json();
    if (data.error) throw new Error(data.error);

    reportHeaders = data.headers || [];
    reportData = data.rows || [];
    renderReportTable(reportData);

    const updated = data.updated ? new Date(data.updated).toLocaleString("uk-UA") : "";
    if (updated) {
      const info = document.createElement("div");
      info.style = "color:#444;font-size:11px;margin-bottom:8px;";
      info.textContent = "Оновлено: " + updated;
      container.prepend(info);
    }
  } catch(e) {
    container.innerHTML = '<div style="text-align:center;padding:40px;color:#f44336;">❌ ' + e.message + '</div>';
  }
}

function filterReport(query) {
  if (!query) { renderReportTable(reportData); return; }
  const q = query.toLowerCase();
  const filtered = reportData.filter(row =>
    String(row["Артикул"]||"").toLowerCase().includes(q) ||
    String(row["Назва"]||"").toLowerCase().includes(q)
  );
  renderReportTable(filtered);
}

function renderReportTable(rows) {
  const container = document.getElementById("report-container");
  if (!container) return;
  if (!rows || rows.length === 0) {
    container.innerHTML = '<div style="text-align:center;padding:40px;color:#555;">Нічого не знайдено</div>';
    return;
  }

  // Warehouse columns only (skip Артикул, Назва, Од.вим., Всього for coloring)
  const whCols = reportHeaders.filter(h => h.startsWith("Склад"));

  let html = '<table style="width:100%;border-collapse:collapse;font-size:12px;">';

  // Header
  html += '<thead><tr>';
  reportHeaders.forEach(h => {
    const isWh = h.startsWith("Склад");
    const shortName = isWh ? h.replace("Склад ", "") : h;
    html += '<th style="padding:8px 10px;text-align:left;border-bottom:1px solid #2a2a2a;color:' +
      (h === "Всього" ? "#c9a84c" : isWh ? "#7b68ee" : "#777") +
      ';white-space:nowrap;font-size:11px;">' + shortName + '</th>';
  });
  html += '</tr></thead><tbody>';

  // Rows
  rows.forEach((row, ri) => {
    html += '<tr style="background:' + (ri % 2 === 0 ? "#111" : "#0f0f0f") + ';">';
    reportHeaders.forEach(h => {
      const val = row[h];
      const isWh = h.startsWith("Склад");
      const isTotal = h === "Всього";
      const isNum = isWh || isTotal;
      const numVal = parseFloat(val) || 0;
      let color = "#aaa";
      if (isNum) {
        color = numVal > 0 ? (isTotal ? "#c9a84c" : "#4caf50") : "#444";
      } else if (h === "Артикул") {
        color = "#c9a84c";
      } else if (h === "Назва") {
        color = "#fff";
      } else if (h === "Од. вим.") {
        color = "#777";
      }
      html += '<td style="padding:7px 10px;border-bottom:1px solid #1a1a1a;color:' + color +
        ';white-space:nowrap;">' +
        (isNum && numVal > 0 ? numVal.toFixed(2) : isNum ? "—" : val) +
        '</td>';
    });
    html += '</tr>';
  });

  html += '</tbody></table>';
  container.innerHTML = html;
}

        </div>
        <div class="modal-footer">

}

}

async function generateReviews() {
  const btn = document.getElementById("gen-reviews-btn");
  const name = document.getElementById("f-name")?.value || state.editItem?.name || "";
  const size = document.getElementById("f-size")?.value || state.editItem?.size || "";
  const tags = (state.editItem?.tags || []).join(", ");

  if (!name) { showToast("Спочатку введіть назву!", "error"); return; }

  btn.textContent = "⏳ Генерую...";
  btn.disabled = true;

  try {
    const res = await fetch("https://svbmamaqrtsknuztxiuq.supabase.co/functions/v1/generate-desc", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN2Ym1hbWFxcnRza251enR4aXVxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkyMDkzMTcsImV4cCI6MjA5NDc4NTMxN30.4ieisyQMCsW2hon_vzNTTt00fRJe5eCXWklUBD9QC_o"
      },
      body: JSON.stringify({
        name, size, tags,
        prompt: "Згенеруй 5 реалістичних відгуків українською мовою про керамічну плитку " + name + " розміром " + size + ". Відгуки мають бути від різних людей з різними іменами (Олена К., Михайло В. тощо), різними оцінками від 4 до 5 зірок, короткими (1-2 речення). Відповідь ТІЛЬКИ у форматі JSON масиву: [{author,rating,text}]. Без пояснень."
      })
    });
    const data = await res.json();
    let reviews = [];
    try {
      const text = data.description || "";
      const jsonMatch = text.match(/\[.*\]/s);
      if (jsonMatch) reviews = JSON.parse(jsonMatch[0]);
    } catch(e) { console.log("Parse error:", e); }

    if (reviews.length > 0) {
      const now = new Date().toISOString();
      state.editItem.reviews = reviews.map(r => ({ ...r, created_at: now }));
      showToast("✅ Згенеровано " + reviews.length + " відгуків!", "success");
      render();
    } else {
      showToast("Помилка генерації відгуків", "error");
    }
  } catch(e) {
    showToast("Помилка: " + e.message, "error");
  }
  btn.textContent = "✨ Згенерувати AI";
  btn.disabled = false;
}

function updateReview(index, field, value) {
  if (!state.editItem.reviews) return;
  state.editItem.reviews[index][field] = field === "rating" ? parseInt(value) : value;
  if (field === "rating") renderReviewsOnly();
}

function removeReview(index) {
  if (!state.editItem.reviews) return;
  state.editItem.reviews.splice(index, 1);
  renderReviewsOnly();
}

function addEmptyReview() {
  if (!state.editItem.reviews) state.editItem.reviews = [];
  state.editItem.reviews.push({
    author: "Клієнт",
    rating: 5,
    text: "",
    created_at: new Date().toISOString()
  });
  renderReviewsOnly();
}

function renderReviewsOnly() {
  const list = document.getElementById("reviews-list");
  if (!list || !state.editItem.reviews) return;
  list.innerHTML = state.editItem.reviews.map((r, i) =>
    `<div style="background:#1a1a1a;border-radius:10px;padding:10px 12px;border:1px solid #2a2a2a;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
        <input value="${r.author}" onchange="updateReview(${i},'author',this.value)"
          style="background:transparent;border:none;color:#c9a84c;font-size:12px;font-weight:700;outline:none;width:120px;">
        <div style="display:flex;gap:2px;">
          ${[1,2,3,4,5].map(s => `<span onclick="updateReview(${i},'rating',${s})" style="cursor:pointer;font-size:14px;color:${s<=r.rating?'#f4b942':'#333'}">${s<=r.rating?'★':'☆'}</span>`).join('')}
        </div>
        <span onclick="removeReview(${i})" style="cursor:pointer;color:#444;font-size:16px;padding:0 4px;">×</span>
      </div>
      <textarea onchange="updateReview(${i},'text',this.value)" rows="2"
        style="width:100%;background:transparent;border:none;color:#777;font-size:12px;outline:none;resize:none;line-height:1.5;">${r.text}</textarea>
      <div style="color:#333;font-size:10px;margin-top:4px;">${r.created_at ? new Date(r.created_at).toLocaleDateString('uk-UA') : ''}</div>
    </div>`
  ).join('');
}

function toggleSaleSection(active) {
  const section = document.getElementById("sale-section");
  if (section) section.style.display = active ? "block" : "none";
  if (!active) {
    const sp = document.getElementById("f-sale-price");
    const spc = document.getElementById("f-sale-percent");
    const su = document.getElementById("f-sale-until");
    if (sp) sp.value = "";
    if (spc) spc.value = "";
    if (su) su.value = "";
  }
}

function calcSalePercent(priceVal) {
  const price = parseFloat(priceVal);
  const uah = parseFloat(document.getElementById("f-price-uah")?.value || "0");
  if (!isNaN(price) && price > 0 && uah > 0) {
    const percent = Math.round((1 - price / uah) * 100);
    const percentEl = document.getElementById("f-sale-percent");
    if (percentEl) percentEl.value = percent > 0 ? percent : "";
  }
  updateSalePreview();
}

function calcSalePrice(percentVal) {
  const percent = parseFloat(percentVal);
  const uah = parseFloat(document.getElementById("f-price-uah")?.value || "0");
  if (!isNaN(percent) && percent > 0 && uah > 0) {
    const salePrice = Math.round(uah * (1 - percent / 100));
    const priceEl = document.getElementById("f-sale-price");
    if (priceEl) priceEl.value = salePrice;
  }
  updateSalePreview();
}

function updateSalePreview() {
  const preview = document.getElementById("sale-preview");
  if (!preview) return;
  const salePrice = parseFloat(document.getElementById("f-sale-price")?.value || "0");
  const uah = parseFloat(document.getElementById("f-price-uah")?.value || "0");
  const until = document.getElementById("f-sale-until")?.value;
  if (salePrice > 0 && uah > 0) {
    const savings = Math.round(uah - salePrice);
    const percent = Math.round((1 - salePrice / uah) * 100);
    preview.innerHTML = "🔥 " + salePrice.toLocaleString() + " грн " +
      "(було " + uah.toLocaleString() + " грн, економія " + savings.toLocaleString() + " грн · -" + percent + "%)" +
      (until ? "<br>⏰ до " + new Date(until).toLocaleDateString("uk-UA") : "");
    preview.style.display = "block";
  } else {
    preview.style.display = "none";
  }
}

let searchTimeout = null;

function handleSearchInput(val) {
  state.collectionSearch = val;
  // Оновлюємо список без перерендеру поля пошуку
  clearTimeout(searchTimeout);

function clearSearch() {
  state.collectionSearch = "";
  const input = document.getElementById("collection-search-input");

  renderCollectionsList();
}

function renderCollectionsList() {
  const isPanno = state.tab === "pannos";
  const container = document.getElementById("collections-list-container");
  if (container) {
    const searchVal = state.collectionSearch || "";
    const items = state.collections.filter(c => {
      if (c.is_panno !== isPanno) return false;
      if (!searchVal) return true;
      const q = searchVal.toLowerCase();
      return (c.name || "").toLowerCase().includes(q) ||
             (c.article || "").toLowerCase().includes(q) ||
             (c.size || "").toLowerCase().includes(q);
    });
    const clearBtn = document.getElementById("search-clear-btn");
    if (clearBtn) clearBtn.style.display = searchVal ? "block" : "none";
    const countEl = document.getElementById("collections-count");
    if (countEl) countEl.textContent = items.length + " позицій";
    container.innerHTML = items.length === 0
      ? '<div style="text-align:center;padding:40px;color:#333;">' + (searchVal ? "Нічого не знайдено" : "Немає позицій") + "</div>"
      : items.map(item => renderCollectionRow(item)).join("");
  }
}

function bindEvents() {
  // Restore search input value after render
  const input = document.getElementById("collection-search-input");
  if (input && state.collectionSearch) {
    input.value = state.collectionSearch;
    input.focus();
    input.setSelectionRange(input.value.length, input.value.length);
  }
  // Ensure all inputs in modal are editable
  setTimeout(() => {
    document.querySelectorAll('.modal-body input, .modal-body textarea').forEach(el => {
      el.removeAttribute('disabled');
      el.removeAttribute('readonly');
      el.style.pointerEvents = 'auto';
      el.style.userSelect = 'text';
      el.style.webkitUserSelect = 'text';
      el.style.opacity = '1';
      el.style.cursor = 'text';
    });
  }, 100);
}

async function loadData() {
  state.loading = true;
  try {
    const [collections, photos, settings] = await Promise.all([
      api("GET", "collections?select=*&order=sort_order,created_at"),
      api("GET", "collection_photos?select=*&order=sort_order"),
      api("GET", "settings?select=*")
    ]);
    
    // Attach photos to collections
    state.collections = (collections || []).map(c => ({
      ...c,
      photos: (photos || []).filter(p => p.collection_id === c.id)
    }));

    // Load rates
    const eurSetting = (settings || []).find(s => s.key === "eur_rate");
    const usdSetting = (settings || []).find(s => s.key === "usd_rate");
    const autoSetting = (settings || []).find(s => s.key === "auto_rate");
    
    state.autoRate = autoSetting?.value === "true";
    if (state.autoRate) {
      const rates = await getNBURate();
      state.rates = rates;
    } else {
      state.rates = {
        eur: parseFloat(eurSetting?.value || "43.5"),
        usd: parseFloat(usdSetting?.value || "41.2")
      };
    }
  } catch(e) {
    console.error(e);
    showToast('Помилка: ' + e.message, 'error');
  }
  state.loading = false;
  render();
}

function openAddModal(isPanno) {

function openEditModal(id) {

async function handlePhotoUpload(input) {
  const files = Array.from(input.files);
  const collId = state.editItem?.id || "new";
  
  for (const file of files) {
    const reader = new FileReader();
    reader.onload = (e) => {
      if (!state.editItem.photos) state.editItem.photos = [];
      state.editItem.photos.push({ url: e.target.result, file, isNew: true });
      render();
    };
    reader.readAsDataURL(file);
  }
}

function getExistingTags(currentTags) {
  // Збираємо всі унікальні теги з усіх колекцій
  const allTags = new Set();
  state.collections.forEach(c => {
    (c.tags || []).forEach(t => allTags.add(t));
  });

  return Array.from(allTags).filter(t => !currentTags.includes(t)).sort();

// Drag & Drop для фото
let dragSrcIndex = null;

function dragStart(e, index) {
  dragSrcIndex = index;
  e.dataTransfer.effectAllowed = "move";
  e.target.closest(".photo-item").style.opacity = "0.4";
}

function dragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = "move";
  return false;
}

function dragDrop(e, targetIndex) {
  e.preventDefault();
  if (dragSrcIndex === null || dragSrcIndex === targetIndex) return;
  
  const photos = state.editItem.photos || [];
  const dragged = photos[dragSrcIndex];
  photos.splice(dragSrcIndex, 1);
  photos.splice(targetIndex, 0, dragged);
  state.editItem.photos = [...photos];
  dragSrcIndex = null;
  render();
  return false;
}

function dragEnd(e) {
  dragSrcIndex = null;
  // Reset opacity for all items
  document.querySelectorAll(".photo-item").forEach(el => el.style.opacity = "1");
}

function addTag() {
  const input = document.getElementById("tag-input");
  if (!input) return;
  const tag = input.value.trim();
  if (!tag) return;
  if (!state.editItem.tags) state.editItem.tags = [];
  if (!state.editItem.tags.includes(tag)) {
    state.editItem.tags.push(tag);
    renderTagsOnly();
  }
  input.value = "";
  input.focus();
}

function removeTag(tag) {
  if (!state.editItem.tags) return;
  state.editItem.tags = state.editItem.tags.filter(t => t !== tag);
  renderTagsOnly();
}

function renderTagsOnly() {
  const list = document.getElementById("tags-list");
  if (!list) return;
  list.innerHTML = (state.editItem.tags || []).map(tag =>
    `<span style="display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;background:#c9a84c22;border:1px solid #c9a84c44;color:#c9a84c;font-size:12px;font-weight:700;">
      ${tag}
      <span data-remove="${tag}" style="cursor:pointer;font-size:16px;line-height:1;padding:0 2px;">×</span>
    </span>`
  ).join('');

  // Оновлюємо існуючі теги
  const existingContainer = document.getElementById("existing-tags-container");
  if (existingContainer) {
    const existing = getExistingTags(state.editItem.tags || []);
    existingContainer.innerHTML = existing.map(tag =>
      `<span data-add="${tag}" style="cursor:pointer;padding:4px 10px;border-radius:20px;background:#1a1a1a;border:1px solid #2a2a2a;color:#555;font-size:12px;font-weight:700;">+ ${tag}</span>`
    ).join('');
  }
}

function recalcPrices(source, val) {
  const v = parseFloat(val);
  if (isNaN(v) || v < 0) return;
  const eur_rate = state.rates.eur || 43.5;
  const usd_rate = state.rates.usd || 41.2;

  let uah = 0;
  if (source === "uah") uah = v;
  else if (source === "eur") uah = v * eur_rate;
  else if (source === "usd") uah = v * usd_rate;

  const eur = Math.round((uah / eur_rate) * 100) / 100;
  const usd = Math.round((uah / usd_rate) * 100) / 100;
  const uahR = Math.round(uah);

  const uahEl = document.getElementById("f-price-uah");
  const eurEl = document.getElementById("f-price-eur");
  const usdEl = document.getElementById("f-price-usd");

  if (source !== "uah" && uahEl) uahEl.value = uahR;
  if (source !== "eur" && eurEl) eurEl.value = eur;
  if (source !== "usd" && usdEl) usdEl.value = usd;
}

function calcFromEur(val) { recalcPrices("eur", val); }
function calcFromUsd(val) { recalcPrices("usd", val); }
function calcFromUah(val) { recalcPrices("uah", val); }

async function saveItem() {
  const btn = document.getElementById("save-btn");
  btn.disabled = true;
  btn.textContent = "Збереження...";

  try {
    const item = state.editItem;
    const data = {
      name: document.getElementById("f-name").value.trim(),
      article: document.getElementById("f-article").value.trim(),
      size: document.getElementById("f-size").value.trim(),
      price_uah: Math.max(0, parseFloat(document.getElementById("f-price-uah").value) || 0),
      price_eur: Math.max(0, parseFloat(document.getElementById("f-price-eur").value) || 0),
      price_usd: Math.max(0, parseFloat(document.getElementById("f-price-usd").value) || 0),
      price_wholesale: Math.max(0, parseFloat(document.getElementById("f-price-wholesale").value) || 0),
      description: document.getElementById("f-desc").value.trim(),
      tags: item.tags || [],
      is_visible: document.getElementById("f-visible").checked,
      is_panno: item.is_panno || false,
      finish_tags: item.finish_tags || [],
      bundle_articles: item.bundle_articles || [],
      reviews: state.editItem.reviews || [],
      sale_price: Math.max(0, parseFloat(document.getElementById("f-sale-price")?.value || "0") || 0),
      sale_percent: Math.max(0, parseInt(document.getElementById("f-sale-percent")?.value || "0") || 0),
      sale_until: document.getElementById("f-sale-until")?.value || null,
      updated_at: new Date().toISOString()
    };

    if (!data.name) { showToast('Введіть назву!', 'error'); btn.disabled = false; btn.textContent = "Зберегти"; return; }

    let collectionId = item.id;

    if (item.id) {
      await api("PATCH", `collections?id=eq.${item.id}`, data);
    } else {
      const result = await api("POST", "collections", data);
      collectionId = result[0].id;
    }

    // Видаляємо фото які були прибрані
    const allPhotos = item.photos || [];
    const existingPhotos = allPhotos.filter(p => !p.isNew && p.url);
    const existingUrls = existingPhotos.map(p => p.url);
    
    // Отримуємо всі фото з бази
    const dbPhotos = await api("GET", `collection_photos?collection_id=eq.${collectionId}&select=id,url`);
    if (dbPhotos && dbPhotos.length > 0) {
      for (const dbPhoto of dbPhotos) {
        if (!existingUrls.includes(dbPhoto.url)) {
          await api("DELETE", `collection_photos?id=eq.${dbPhoto.id}`);
        }
      }
    }

    // Оновлюємо sort_order для існуючих фото (з урахуванням нового порядку)
    for (let i = 0; i < allPhotos.length; i++) {
      const photo = allPhotos[i];
      if (!photo.isNew && photo.url && dbPhotos) {
        const dbPhoto = dbPhotos.find(p => p.url === photo.url);
        if (dbPhoto) {
          await api("PATCH", `collection_photos?id=eq.${dbPhoto.id}`, { sort_order: i });
        }
      }
    }

    // Upload new photos
    const newPhotos = allPhotos.filter(p => p.isNew && p.file);
    for (let i = 0; i < newPhotos.length; i++) {
      const photo = newPhotos[i];
      const url = await uploadPhoto(photo.file, collectionId);
      const globalIndex = allPhotos.indexOf(photo);
      await api("POST", "collection_photos", {
        collection_id: parseInt(collectionId),
        url,
        sort_order: globalIndex
      });
    }

    await loadData();
    closeModal();
  } catch(e) {
    showToast('Помилка: ' + e.message, 'error');
    btn.disabled = false;
    btn.textContent = "Зберегти";
  }
}

async function deleteItem(id) {

}

async function refreshRates() {
  const rates = await getNBURate();
  state.rates = rates;
  await Promise.all([
    api("PATCH", "settings?key=eq.eur_rate", { value: rates.eur.toString() }),
    api("PATCH", "settings?key=eq.usd_rate", { value: rates.usd.toString() })
  ]);
  render();
}

async function saveRates() {
  const eur = parseFloat(document.getElementById("rate-eur").value);
  const usd = parseFloat(document.getElementById("rate-usd").value);
  state.rates = { eur, usd };
  await Promise.all([
    api("PATCH", "settings?key=eq.eur_rate", { value: eur.toString() }),
    api("PATCH", "settings?key=eq.usd_rate", { value: usd.toString() })
  ]);
  showToast('Курс збережено! ✅', 'success');
  render();
}
